id_evaluacion: "querylibrary_DER04"
nivel_complejidad: "compleja"
domain_main: "drug_era"
domain_others: "observation_period"
pregunta_lenguaje_natural: >-
  Determinar la proporción del tiempo total de observación médica durante la cual un paciente estuvo expuesto a estrógenos conjugados.
sql_base_gold_standard: |
  SELECT (CASE WHEN o.totalObs = 0 THEN 0 ELSE 100 * (e.totExposure * 1.0 / o.totalObs * 1.0) END) AS proportion
  FROM (
           SELECT SUM(datediff(day, r.drug_era_start_date, r.drug_era_end_date)) AS totExposure,
                  r.person_id
           FROM `bio-med-480108.OMOP_54_A.drug_era` r
           WHERE r.person_id = 9717995
             AND r.drug_concept_id = 1549080
           GROUP BY r.person_id
       ) e
  JOIN
       (
           SELECT sum(datediff(day, p.observation_period_start_date, p.observation_period_end_date)) AS totalObs,
                  p.person_id
           FROM `bio-med-480108.OMOP_54_A.observation_period` p
           GROUP BY p.person_id
       ) o
      ON o.person_id = e.person_id;
concept_ids_gold_standard: "1549080"
