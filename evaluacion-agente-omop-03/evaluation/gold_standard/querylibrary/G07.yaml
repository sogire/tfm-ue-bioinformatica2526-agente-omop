id_evaluacion: "querylibrary_G07"
nivel_complejidad: "compleja"
domain_main: "concept"
domain_others: "concept_relationship"
pregunta_lenguaje_natural: >-
  Listar todas las relaciones ontológicas directas e indirectas que mantiene el concepto de hemorragia gastrointestinal con otros conceptos del vocabulario.
sql_base_gold_standard: |
  SELECT
    'Relates to'         AS relationship_polarity,
    cr.relationship_id   AS relationship_id,
    d.concept_id         AS concept_id,
    d.concept_name       AS concept_name,
    d.concept_code       AS concept_code,
    d.concept_class_id   AS concept_class_id,
    d.vocabulary_id      AS concept_vocab_id
  FROM `bio-med-480108.OMOP_54_A.concept_relationship` AS cr
    JOIN `bio-med-480108.OMOP_54_A.concept` AS a ON cr.concept_id_1 = a.concept_id
    JOIN `bio-med-480108.OMOP_54_A.concept` AS d ON cr.concept_id_2 = d.concept_id
  WHERE 
    a.concept_id = 192671 AND
    cr.invalid_reason IS NULL

  UNION ALL

  SELECT
    'Is related by'      AS relationship_polarity,
    cr.relationship_id   AS relationship_id,
    a.concept_id         AS concept_id,
    a.concept_name       AS concept_name,
    a.concept_code       AS concept_code,
    a.concept_class_id   AS concept_class_id,
    a.vocabulary_id      AS concept_vocab_id
  FROM `bio-med-480108.OMOP_54_A.concept_relationship` AS cr
    JOIN `bio-med-480108.OMOP_54_A.concept` AS a ON cr.concept_id_1 = a.concept_id
    JOIN `bio-med-480108.OMOP_54_A.concept` AS d ON cr.concept_id_2 = d.concept_id
  WHERE 
    d.concept_id = 192671 AND
    cr.invalid_reason IS NULL
  ;
concept_ids_gold_standard: "192671"
