id_evaluacion: "querylibrary_OP18"
nivel_complejidad: "compleja"
domain_main: "observation_period"
domain_others: ""
pregunta_lenguaje_natural: >-
  Contar los períodos de observación médica estratificados por el mes de inicio del período de seguimiento.
sql_base_gold_standard: |
  WITH observation_period_month AS
    ( SELECT
        MONTH(observation_period_start_date) AS observation_month
        FROM `bio-med-480108.OMOP_54_A.observation_period`
    )
  SELECT
    observation_month,
    COUNT(*)                             AS num_observations
  FROM observation_period_month
  GROUP BY observation_month
  ORDER BY 1;
concept_ids_gold_standard: ""
