id_evaluacion: "querylibrary_CO23"
nivel_complejidad: "intermedia"
domain_main: "condition_occurrence"
domain_others: "concept"
pregunta_lenguaje_natural: >-
  Calcular la distribución temporal por mes y año de los diagnósticos de nefropatía diabética.
sql_base_gold_standard: |
  SELECT condition_concept_id,
         concept_name,
         condition_month_year,
         count(*)                   AS occurrences_count
    FROM
        (SELECT condition_concept_id,
                concept_name,

                CONCAT(MONTH(condition_start_date), '-', YEAR(condition_start_date))  AS condition_month_year,
                MONTH(condition_start_date)                                           AS m1
          FROM `bio-med-480108.OMOP_54_A.condition_occurrence` condition
          INNER JOIN `bio-med-480108.OMOP_54_A.concept` concept
          ON condition.condition_concept_id = concept.concept_id AND condition.condition_concept_id=192279
        ) AS m1
  GROUP BY condition_concept_id,
           concept_name,
           condition_month_year,
           m1
  ORDER BY m1;
concept_ids_gold_standard: "192279"
