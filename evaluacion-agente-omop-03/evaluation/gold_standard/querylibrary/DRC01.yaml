id_evaluacion: "querylibrary_DRC01"
nivel_complejidad: "intermedia"
domain_main: "cost"
domain_others: "drug_exposure"
pregunta_lenguaje_natural: >-
  Calcular el costo unitario promedio, mínimo y máximo por pastilla (costo total dividido entre la cantidad dispensada) para los medicamentos seleccionados (metoclopramida, desmopresina y ciclosporina).
sql_base_gold_standard: |
  SELECT  t.drug_concept_id,
          avg(t.cost_per_pill) avg_val_num, 
          max(t.cost_per_pill) max_val_num, 
          min(t.cost_per_pill) min_val_num
  from (
      SELECT c.total_paid/d.quantity as cost_per_pill, d.drug_concept_id
      FROM `bio-med-480108.OMOP_54_A.cost` c
      JOIN `bio-med-480108.OMOP_54_A.drug_exposure` d
          ON d.drug_exposure_id = c.cost_event_id
      WHERE d.quantity > 0
          AND d.drug_concept_id IN (906805, 1517070, 19010522) 
  ) t
  GROUP BY t.drug_concept_id
  ORDER BY t.drug_concept_id;
concept_ids_gold_standard: "906805, 1517070, 19010522"
