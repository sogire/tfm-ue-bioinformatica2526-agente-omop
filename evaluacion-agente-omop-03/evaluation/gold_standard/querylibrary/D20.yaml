id_evaluacion: "querylibrary_D20"
nivel_complejidad: "intermedia"
domain_main: "concept"
domain_others: "concept_relationship"
pregunta_lenguaje_natural: >-
  Determinar la forma farmacéutica o de dosificación (tableta, solución oral, inyección, etc.) correspondiente a una formulación de medicamento clínico de referencia.
sql_base_gold_standard: |
  SELECT
          A.concept_id drug_concept_id,
           A.concept_name drug_name,
           A.concept_code drug_concept_code,
           D.concept_id dose_form_concept_id,
           D.concept_name dose_form_concept_name,
           D.concept_code dose_form_concept_code
  FROM
          `bio-med-480108.OMOP_54_A.concept_relationship` CR,
           `bio-med-480108.OMOP_54_A.concept` A,
           `bio-med-480108.OMOP_54_A.concept` D
  WHERE
          (getdate() >= CR.valid_start_date) AND (getdate() <= CR.valid_end_date)
          AND CR.concept_id_1 = A.concept_id
          AND CR.concept_id_2 = D.concept_id
          AND CR.concept_id_1 = 19060647
          AND CR.relationship_id = 'RxNorm has dose form'
          --AND CR.relationship_ID = 4
          --AND A.concept_class_id ='Clinical Drug'
          --AND A.vocabulary_id = 'RxNorm'
          ;
concept_ids_gold_standard: "19060647"
