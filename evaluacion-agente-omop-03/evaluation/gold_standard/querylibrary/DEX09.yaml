id_evaluacion: "querylibrary_DEX09"
nivel_complejidad: "compleja"
domain_main: "drug_exposure"
domain_others: "person"
pregunta_lenguaje_natural: >-
  Calcular la distribución estadística (media, cuartiles) del número de medicamentos distintos dispensados por paciente durante un intervalo temporal.
sql_base_gold_standard: |
  WITH drug_counts
  AS (
    SELECT DE.person_id,
      COALESCE(drugs, 0) AS drugs
    FROM `bio-med-480108.OMOP_54_A.person` p
    LEFT JOIN (
      SELECT person_id,
        COUNT(DISTINCT drug_concept_id) AS drugs
      FROM `bio-med-480108.OMOP_54_A.drug_exposure`
      WHERE drug_exposure_start_date >= DATEFROMPARTS(2017, 01, 01)
        AND drug_exposure_start_date <= DATEFROMPARTS(2017, 12, 31)
      GROUP BY person_id
      ) DE ON DE.person_id = p.person_id
    )
  SELECT MIN(drugs) AS min,
    MIN(CASE WHEN order_nr < .25 * population_size THEN 9999 ELSE drugs END) AS percentile_25,
    ROUND(CAST(AVG(drugs) AS NUMERIC), 2) AS mean,
    MIN(CASE WHEN order_nr < .50 * population_size THEN 9999 ELSE drugs  END) AS median,
    MIN(CASE WHEN order_nr < .75 * population_size THEN 9999 ELSE drugs  END) AS percentile_75,
    MAX(drugs) AS max,
    ROUND(CAST(STDEV(drugs) AS NUMERIC), 1) AS STDEV
  FROM (
    SELECT person_id,
      drugs,
      ROW_NUMBER() OVER (
        ORDER BY drugs
        ) AS order_nr
    FROM drug_counts
    ) AS ordered_data
  CROSS JOIN (
    SELECT count(*) AS population_size
    FROM drug_counts
    ) AS population;
