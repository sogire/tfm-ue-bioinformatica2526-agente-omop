id_evaluacion: "querylibrary_DEX27"
nivel_complejidad: "compleja"
domain_main: "drug_exposure"
domain_others: ""
pregunta_lenguaje_natural: >-
  Calcular estadísticas descriptivas (media, cuartiles y dispersión) de las fechas de inicio de las dispensaciones farmacológicas registradas.
sql_base_gold_standard: |
  WITH dexp_start_dates AS
  ( SELECT
      DATEDIFF(d,(SELECT MIN(drug_exposure_start_date) FROM `bio-med-480108.OMOP_54_A.drug_exposure`), drug_exposure_start_date) AS start_date_num,
      drug_exposure_start_date                                                                             AS start_date,
      (SELECT MIN(drug_exposure_start_date) FROM `bio-med-480108.OMOP_54_A.drug_exposure`)                                       AS min_date
    FROM `bio-med-480108.OMOP_54_A.drug_exposure`
  )
  SELECT
    min(start_date)                                                                                             AS min_date,
    max(start_date)                                                                                             AS max_date,
    dateadd(dd, avg(CAST(start_date_num AS BIGINT)), min_date)                                                                  AS avg_date,
    round(STDEV(start_date_num), 0)                                                                             AS stdev_days,
    dateadd(dd,  MIN(CASE WHEN order_nr < .25 * population_size THEN 99999999 ELSE start_date_num END), min_date) AS percentile_25_date,
    dateadd(dd,  MIN(CASE WHEN order_nr < .50 * population_size THEN 99999999 ELSE start_date_num END), min_date) AS median_date,
    dateadd(dd,  MIN(CASE WHEN order_nr < .75 * population_size THEN 99999999 ELSE start_date_num END), min_date) AS percentile_75_date
  FROM
   ( SELECT
      start_date_num,                                                              
      start_date,
      min_date,
      ROW_NUMBER() OVER ( ORDER BY start_date_num)      AS  order_nr,
      (SELECT COUNT(*) FROM dexp_start_dates)           AS population_size
    FROM dexp_start_dates
  ) AS ordered_data
  GROUP BY min_date;
