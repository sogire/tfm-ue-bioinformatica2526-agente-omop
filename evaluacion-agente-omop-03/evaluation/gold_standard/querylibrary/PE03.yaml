id_evaluacion: "querylibrary_PE03"
nivel_complejidad: "intermedia"
domain_main: "person"
domain_others: "concept"
pregunta_lenguaje_natural: >-
  Obtener el recuento total y la distribución de pacientes en la base de datos clasificados según cada concepto de género registrado.
sql_base_gold_standard: |
  SELECT
    person.gender_concept_id,
    concept.concept_name    AS gender_name,
    COUNT(person.person_id) AS num_persons
  FROM `bio-med-480108.OMOP_54_A.person`
    JOIN `bio-med-480108.OMOP_54_A.concept` ON person.gender_concept_id = concept.concept_id
  GROUP BY person.gender_concept_id, concept.concept_name
  ;
concept_ids_gold_standard: ""
