pregunta_lenguaje_natural: >-
  Contar el número total de registros de dispensación farmacológica para los medicamentos especificados (metoclopramida, desmopresina y ciclosporina).
sql_base_gold_standard: |
  SELECT COUNT(*) as exposure_occurrence_count  
    FROM `bio-med-480108.OMOP_54_A.drug_exposure`
   WHERE drug_concept_id IN (906805, 1517070, 19010522);
concept_ids_gold_standard: "906805, 1517070, 19010522"
