id_evaluacion: "querylibrary_D22"
nivel_complejidad: "compleja"
domain_main: "concept"
domain_others: "concept_ancestor, concept_relationship"
pregunta_lenguaje_natural: >-
  Identificar los medicamentos que pertenecen a la clase terapéutica de agonistas de receptores hormonales corticosteroides y que se presentan en forma de spray nasal.
sql_base_gold_standard: |
  SELECT C.concept_id drug_concept_id,
  C.concept_name drug_concept_name,
  C.concept_code drug_concept_code
  FROM `bio-med-480108.OMOP_54_A.concept` C,
          `bio-med-480108.OMOP_54_A.concept_ancestor` CA,
          `bio-med-480108.OMOP_54_A.concept_relationship` CRF,
          `bio-med-480108.OMOP_54_A.concept` F
  WHERE CA.ancestor_concept_id = 4318008
          AND C.concept_id = CA.descendant_concept_id
          AND C.domain_id = 'Drug'
          AND C.standard_concept = 'S'
          AND CRF.concept_id_1 = C.concept_id
          AND CRF.relationship_ID = 'RxNorm has dose form'
          AND CRF.concept_id_2 = F.concept_id
          AND CHARINDEX(LOWER(REPLACE(REPLACE(F.concept_name, ' ', ''), '-', '')), LOWER(REPLACE(REPLACE('Nasal spray' , ' ', ''), '-', ''))) > 0
          AND (getdate() >= CRF.valid_start_date) AND (getdate() <= CRF.valid_end_date)
concept_ids_gold_standard: "4318008"
