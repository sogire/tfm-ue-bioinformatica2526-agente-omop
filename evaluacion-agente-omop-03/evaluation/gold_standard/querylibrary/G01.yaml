pregunta_lenguaje_natural: >-
  Obtener la información y atributos detallados en el vocabulario para el concepto de hemorragia gastrointestinal.
sql_base_gold_standard: |
  SELECT
    c.concept_id,
    c.concept_name,
    c.concept_code,
    c.concept_class_id,
    c.standard_concept,
    c.vocabulary_id
  FROM `bio-med-480108.OMOP_54_A.concept` AS c
  WHERE c.concept_id = 192671
  ;
concept_ids_gold_standard: "192671"
