id_evaluacion: "querylibrary_DEX26"
nivel_complejidad: "compleja"
domain_main: "drug_exposure"
domain_others: ""
pregunta_lenguaje_natural: >-
  Calcular estadísticas descriptivas (media, desviación estándar y percentiles) de las fechas de finalización de las exposiciones a medicamentos.
sql_base_gold_standard: |
  WITH dexp_end_dates AS
  ( SELECT
      DATEDIFF(d,(SELECT MIN(drug_exposure_end_date) FROM `bio-med-480108.OMOP_54_A.drug_exposure`), drug_exposure_end_date) AS end_date_num,
      drug_exposure_end_date                                                                           AS end_date,
      (SELECT MIN(drug_exposure_end_date) FROM `bio-med-480108.OMOP_54_A.drug_exposure`)                                     AS min_date
    FROM `bio-med-480108.OMOP_54_A.drug_exposure`
  )
  SELECT
    min(end_date)                                                                                             AS min_date,
    max(end_date)                                                                                             AS max_date,
    dateadd(dd, avg(CAST(end_date_num AS BIGINT)), min_date)                                                                  AS avg_date,
    round(STDEV(end_date_num), 0)                                                                             AS stdev_days,
    dateadd(dd,  MIN(CASE WHEN order_nr < .25 * population_size THEN 999999 ELSE end_date_num END), min_date) AS percentile_25_date,
    dateadd(dd,  MIN(CASE WHEN order_nr < .50 * population_size THEN 999999 ELSE end_date_num END), min_date) AS median_date,
    dateadd(dd,  MIN(CASE WHEN order_nr < .75 * population_size THEN 999999 ELSE end_date_num END), min_date) AS percentile_75_date
  FROM
   ( SELECT
      end_date_num,                                                              
      end_date,
      min_date,
      ROW_NUMBER() OVER ( ORDER BY end_date_num)      AS  order_nr,
      (SELECT COUNT(*) FROM dexp_end_dates)           AS population_size
    FROM dexp_end_dates
  ) AS ordered_data
  GROUP BY min_date;
