id_evaluacion: "querylibrary_CO03"
nivel_complejidad: "compleja"
domain_main: "condition_occurrence"
domain_others: "provider, concept"
pregunta_lenguaje_natural: >-
  Identificar las especialidades médicas de los profesionales que diagnosticaron náuseas y el recuento de pacientes diagnosticados por especialidad.
sql_base_gold_standard: |
  SELECT
    concept_name          AS Specialty,
    specialty_freq        AS Specialty_freq
  FROM  
    ( SELECT
        specialty_concept_id,
        COUNT(*)          AS specialty_freq
        FROM
          ( SELECT
              specialty_concept_id,
              from_cond.provider_id
          FROM
            (SELECT
                provider_id
             FROM `bio-med-480108.OMOP_54_A.condition_occurrence`
             -- Input condition_concept_id
             WHERE condition_concept_id = 31967
                   AND provider_id IS NOT NULL
            ) AS from_cond
            LEFT JOIN
              ( SELECT
                  provider_id       AS provider_id_from_prov,
                  specialty_concept_id
              FROM `bio-med-480108.OMOP_54_A.provider`
            ) AS from_prov
            ON from_cond.provider_id=from_prov.provider_id_from_prov
          ) AS prov_cond_spec
        GROUP BY specialty_concept_id
    ) AS spec_id_count
  LEFT JOIN
    (SELECT
      concept_id,
      concept_name
     FROM `bio-med-480108.OMOP_54_A.concept`
    ) AS spec_concept
  ON spec_id_count.specialty_concept_id = spec_concept.concept_id
  ORDER BY specialty_freq DESC;
concept_ids_gold_standard: "31967"
