id_evaluacion: "querylibrary_CE09"
nivel_complejidad: "intermedia"
domain_main: "condition_era"
domain_others: "concept"
pregunta_lenguaje_natural: >-
  Contar el número total de registros de episodios de condición (condition eras) para una lista de condiciones seleccionadas (incluyendo neumonía e influenza).
sql_base_gold_standard: |
  SELECT ce.condition_concept_id, c.concept_name, COUNT(*) AS records_count
    FROM `bio-med-480108.OMOP_54_A.condition_era` ce
    JOIN `bio-med-480108.OMOP_54_A.concept` c
      ON c.concept_id = ce.condition_concept_id
   WHERE ce.condition_concept_id
      IN /* top five condition concepts */
         ( 256723, 372906, 440377, 441202, 435371 )
   GROUP BY ce.condition_concept_id, c.concept_name
   ORDER BY records_count DESC;
concept_ids_gold_standard: "256723, 372906, 440377, 441202, 435371"
