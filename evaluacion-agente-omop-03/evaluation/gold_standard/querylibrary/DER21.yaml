id_evaluacion: "querylibrary_DER21"
nivel_complejidad: "intermedia"
domain_main: "drug_era"
domain_others: "person"
pregunta_lenguaje_natural: >-
  Contar las exposiciones a los fármacos seleccionados (megestrol, darbepoetina alfa y estrógenos conjugados), estratificando por año de tratamiento, grupo de edad y género.
sql_base_gold_standard: |
  SELECT
    tt.drug_concept_id,
    count(1) as s_count,
    tt.age_band,
    tt.year_of_Era,
    tt.gender_concept_id
  from (
    SELECT
      floor( (YEAR(t.drug_era_start_date ) - p.year_of_birth )/10 ) as age_band,
          YEAR(t.drug_era_start_date) as year_of_era,
          p.gender_concept_id,
          t.drug_concept_id
    FROM
      `bio-med-480108.OMOP_54_A.drug_era` t,
      `bio-med-480108.OMOP_54_A.person` p
    where
      t.person_id = p.person_id and
      t.drug_concept_id in (1300978, 1304643, 1549080)
  ) tt
  where
    tt.age_band in(3,4) and
    tt.year_of_Era in( 2007, 2008)
  group by
    tt.age_band,
    tt.year_of_Era,
    tt.gender_concept_id,
    tt.drug_concept_id
  order by
    tt.age_band,
    tt.year_of_Era,
    tt.gender_concept_id,
    tt.drug_concept_id
  ;
concept_ids_gold_standard: "1300978, 1304643, 1549080"
