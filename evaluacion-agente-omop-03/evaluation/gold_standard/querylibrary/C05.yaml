id_evaluacion: "querylibrary_C05"
nivel_complejidad: "intermedia"
domain_main: "concept"
domain_others: "concept_relationship"
pregunta_lenguaje_natural: >-
  Identificar los conceptos estándar de SNOMED-CT mapeados a partir del código de diagnóstico fuente '706.1' (acné u otras afecciones afines).
sql_base_gold_standard: |
  SELECT DISTINCT
    c1.concept_code     AS source_code,
    c1.concept_name     AS source_name,
    c1.vocabulary_id    AS source_vocabulary_id,
    c2.concept_id       AS target_concept_id,
    c2.concept_name     AS target_concept_name,
    c2.concept_code     AS target_concept_code,
    c2.concept_class_id AS target_concept_class,
    c2.vocabulary_id    AS target_concept_vocab_id
  FROM `bio-med-480108.OMOP_54_A.concept_relationship` AS cr
    JOIN `bio-med-480108.OMOP_54_A.concept` AS c1 ON cr.concept_id_1 = c1.concept_id
    JOIN `bio-med-480108.OMOP_54_A.concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  WHERE
    cr.relationship_id = 'Maps to' AND
    c1.concept_code IN ('070.0') AND
    c1.vocabulary_id = 'ICD9CM' AND
    c1.invalid_reason IS NULL
  ;
concept_ids_gold_standard: ""
