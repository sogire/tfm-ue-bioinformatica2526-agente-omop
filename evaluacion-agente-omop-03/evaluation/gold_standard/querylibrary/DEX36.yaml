id_evaluacion: "querylibrary_DEX36"
nivel_complejidad: "compleja"
domain_main: "drug_exposure"
domain_others: ""
pregunta_lenguaje_natural: >-
  Calcular parámetros estadísticos descriptivos sobre el número de repeticiones de recetas (refills) autorizadas en las dispensaciones farmacológicas.
sql_base_gold_standard: |
  SELECT
      MIN(stat_value)                                                                    AS min_value,
      MAX(stat_value)                                                                    AS max_value,
      AVG(stat_value)                                                                    AS avg_value,
      ROUND(STDEV(stat_value), 1)                                                        AS STDEV_value,
      MIN(CASE WHEN order_nr < .25 * population_size THEN 9999 ELSE stat_value END)      AS percentile_25,
      MIN(CASE WHEN order_nr < .50 * population_size THEN 9999 ELSE stat_value END)      AS median_value,
      MIN(CASE WHEN order_nr < .75 * population_size THEN 9999 ELSE stat_value END)      AS percentile_75

  FROM (
    SELECT
      refills                                                     AS stat_value,
      ROW_NUMBER() OVER (ORDER BY refills)                        AS order_nr,
      (SELECT COUNT(*) FROM `bio-med-480108.OMOP_54_A.drug_exposure` WHERE refills > 0) AS population_size
    FROM `bio-med-480108.OMOP_54_A.drug_exposure`
    -- Retrieve only positive quantities
    WHERE refills > 0
  ) ordered_data;
concept_ids_gold_standard: ""
