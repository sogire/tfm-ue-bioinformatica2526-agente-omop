id_evaluacion: "querylibrary_CO08"
nivel_complejidad: "compleja"
domain_main: "condition_occurrence"
domain_others: "visit_occurrence, care_site"
pregunta_lenguaje_natural: >-
  Calcular la duración en días de las estancias hospitalarias para pacientes ingresados con diagnóstico clínico de náuseas.
sql_base_gold_standard: |
  SELECT
    avg(hosp_no_days) AS average_hosp_duration_count
  FROM
    (SELECT DISTINCT
      hosp_no_days,
      person_id,
      from_visit.visit_occurrence_id
     FROM
      (SELECT
        visit_occurrence_id,
        condition_start_date,
        condition_end_date,
        person_id
       FROM `bio-med-480108.OMOP_54_A.condition_occurrence`
       WHERE condition_concept_id = 31967 -- Input condition_concept_id
             AND visit_occurrence_id IS NOT NULL
      ) AS from_cond
  INNER JOIN
    (SELECT
      DATEDIFF(DAY, visit_start_date, visit_end_date) + 1 AS hosp_no_days,
      visit_start_date,
      visit_occurrence_id,
      place_of_service_concept_id
     FROM `bio-med-480108.OMOP_54_A.visit_occurrence` v
     INNER JOIN `bio-med-480108.OMOP_54_A.care_site` c
     ON v.care_site_id=c.care_site_id
     WHERE place_of_service_concept_id = 8717 -- Inpatient hospital
    ) AS from_visit
  ON from_cond.visit_occurrence_id = from_visit.visit_occurrence_id
   ) AS hosp_duration_count
  ;
concept_ids_gold_standard: "31967, 8717"
