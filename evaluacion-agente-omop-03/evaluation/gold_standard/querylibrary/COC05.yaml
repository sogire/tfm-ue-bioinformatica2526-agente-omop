id_evaluacion: "querylibrary_COC05"
nivel_complejidad: "compleja"
domain_main: "condition_era"
domain_others: "concept, concept_relationship, concept_ancestor, observation_period, death"
pregunta_lenguaje_natural: >-
  Calcular la tasa de mortalidad en pacientes diagnosticados con infarto agudo de miocardio tras su diagnóstico inicial en un período de seguimiento específico.
sql_base_gold_standard: |
  SELECT COUNT(DISTINCT diagnosed.person_id) AS all_infarctions,
    SUM(CASE
        WHEN death.person_id IS NULL
          THEN 0
        ELSE 1
        END) AS death_from_infarction
  FROM -- Initial diagnosis of Acute Myocardial Infarction
    (
    SELECT DISTINCT person_id,
      condition_era_start_date
    FROM /* diagnosis of Acute Myocardial Infarction, ranked by date, 6 month clean period with 1 year follow-up */
      (
      SELECT condition.person_id,
        condition.condition_era_start_date,
        SUM(1) OVER (
          PARTITION BY condition.person_id ORDER BY condition_era_start_date ROWS UNBOUNDED PRECEDING
          ) AS ranking
      FROM `bio-med-480108.OMOP_54_A.condition_era` condition
      INNER JOIN --definition of Acute Myocardial Infarction 1
        (
        SELECT DISTINCT ca.descendant_concept_id AS concept_id
        FROM `bio-med-480108.OMOP_54_A.concept` concept1
        INNER JOIN `bio-med-480108.OMOP_54_A.concept_relationship` rel ON concept1.concept_id = rel.concept_id_1
        INNER JOIN `bio-med-480108.OMOP_54_A.concept_ancestor` ca ON ancestor_concept_id = concept_id_2
        WHERE rel.relationship_id = 'HOI - SNOMED'
          AND concept1.concept_name = 'OMOP Acute Myocardial Infarction 1'
          AND rel.invalid_reason IS NULL
        ) conceptlist ON conceptlist.concept_id = condition_concept_id
      INNER JOIN `bio-med-480108.OMOP_54_A.observation_period` obs ON obs.person_id = condition.person_id
        AND condition_era_start_date >= DATEADD(day, 180, observation_period_start_date)
        AND condition_era_start_date <= DATEADD(day, - 360, observation_period_end_date)
      ) ranked_diagnosis
    WHERE ranking = 1
    ) diagnosed
  LEFT JOIN `bio-med-480108.OMOP_54_A.death` /* death within a year */
    ON death.person_id = diagnosed.person_id
    AND death.death_date <= DATEADD(day, 360, condition_era_start_date);
concept_ids_gold_standard: ""
