id_evaluacion: "querylibrary_COC07"
nivel_complejidad: "compleja"
domain_main: "condition_era"
domain_others: "procedure_occurrence, concept, concept_relationship, concept_ancestor"
pregunta_lenguaje_natural: >-
  Identificar pacientes diagnosticados con una condición clínica (como anemia aplásica) que además se sometieron a un procedimiento médico específico dentro de una ventana temporal determinada.
sql_base_gold_standard: |
  SELECT DISTINCT condition.condition_concept_id,
    condition.person_id,
    procedure_date,
    condition_era_start_date
  FROM `bio-med-480108.OMOP_54_A.procedure_occurrence` pr
  INNER JOIN `bio-med-480108.OMOP_54_A.condition_era` condition ON condition.person_id = pr.person_id
  INNER JOIN (
    SELECT DISTINCT ca.descendant_concept_id AS concept_id
    FROM `bio-med-480108.OMOP_54_A.concept` concept1
    INNER JOIN `bio-med-480108.OMOP_54_A.concept_relationship` rel ON concept1.concept_id = rel.concept_id_1
    INNER JOIN `bio-med-480108.OMOP_54_A.concept_ancestor` ca ON ancestor_concept_id = concept_id_2
    WHERE rel.relationship_id = 'HOI - SNOMED'
      AND concept1.concept_name = 'OMOP Aplastic Anemia 1'
      AND rel.invalid_reason IS NULL
    ) conceptlist ON conceptlist.concept_id = condition_concept_id
  WHERE pr.procedure_concept_id IN ( 2002382, 2002403, 2108452, 2108453, 2212660, 2212662, 3045142, 3048879, 36359239, 37586183)
    AND procedure_date >= DATEADD(day, - 60, condition_era_start_date)
    AND procedure_date <= condition_era_start_date;
concept_ids_gold_standard: "2002382, 2002403, 2108452, 2108453, 2212660, 2212662, 3045142, 3048879, 36359239, 37586183"
