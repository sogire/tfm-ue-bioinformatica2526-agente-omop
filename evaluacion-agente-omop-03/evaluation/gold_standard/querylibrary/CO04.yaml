id_evaluacion: "querylibrary_CO04"
nivel_complejidad: "compleja"
domain_main: "condition_occurrence"
domain_others: "visit_occurrence, concept"
pregunta_lenguaje_natural: >-
  Contar los diagnósticos de náuseas clasificados según el tipo de centro o lugar de servicio donde se realizó la atención.
sql_base_gold_standard: |
  SELECT
    concept_name AS place_of_service_name,
    place_freq
  FROM
    (SELECT
      care_site_id,
      count(*)  AS place_freq
      FROM
        (SELECT
          care_site_id
        FROM
          (SELECT
            visit_occurrence_id
            FROM `bio-med-480108.OMOP_54_A.condition_occurrence`
            WHERE condition_concept_id = 31967 -- Input condition
                  AND visit_occurrence_id IS NOT NULL
          ) AS from_cond
        LEFT JOIN
          (SELECT
            visit_occurrence_id,
            care_site_id
           FROM `bio-med-480108.OMOP_54_A.visit_occurrence`
          ) AS from_visit
        ON from_cond.visit_occurrence_id=from_visit.visit_occurrence_id
        ) AS from_cond_visit
      GROUP BY care_site_id
    ) AS place_id_count

    LEFT JOIN

    (SELECT
      concept_id,
      concept_name
     FROM `bio-med-480108.OMOP_54_A.concept`
    ) AS place_concept
    ON place_id_count.care_site_id=place_concept.concept_id
  ORDER BY place_freq;
concept_ids_gold_standard: "31967"
