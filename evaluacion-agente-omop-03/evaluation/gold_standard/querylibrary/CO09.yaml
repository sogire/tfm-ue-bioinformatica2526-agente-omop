id_evaluacion: "querylibrary_CO09"
nivel_complejidad: "compleja"
domain_main: "condition_occurrence"
domain_others: ""
pregunta_lenguaje_natural: >-
  Evaluar el patrón de variación estacional en la incidencia de náuseas analizando la frecuencia de diagnósticos por mes del año.
sql_base_gold_standard: |
  SELECT season, 
         COUNT(*) AS season_freq
  FROM 
    (SELECT 
      CASE
        WHEN daymonth>0320 AND daymonth<=0621 THEN 'Spring' 
        WHEN daymonth>0621 AND daymonth<=0922 THEN 'Summer' 
        WHEN daymonth>0922 AND daymonth<=1221 THEN 'Fall' 
        WHEN daymonth>1221 OR (daymonth>0000 AND daymonth<=0520) THEN 'Winter'
        ELSE 'Unknown'
      END                   AS season
      FROM 
         (SELECT 

            CAST(CONCAT(CAST(DAY(condition_start_date) AS VARCHAR), CAST(MONTH(condition_start_date) AS VARCHAR)) AS int) AS daymonth,
            condition_start_date
          FROM `bio-med-480108.OMOP_54_A.condition_occurrence`
          WHERE condition_concept_id = 31967 -- Input condition_concept_id
         ) AS condition_dates
    ) AS condition_season
  GROUP BY season
  ORDER BY season_freq;
concept_ids_gold_standard: "31967"
