id_evaluacion: "querylibrary_OP14"
nivel_complejidad: "compleja"
domain_main: "observation_period"
domain_others: "person, concept"
pregunta_lenguaje_natural: >-
  Calcular la distribución de edad de los pacientes al inicio de su observación, estratificada según cada género registrado.
sql_base_gold_standard: |
  WITH t AS 
    ( SELECT 
        p.person_id, 
        ISNULL( concept_name, 'MISSING' ) AS gender,
        YEAR(first_observation_date ) - year_of_birth AS age
      FROM -- person, first observation period date
        ( SELECT 
            person_id,
            MIN( observation_period_start_date ) AS first_observation_date
          FROM `bio-med-480108.OMOP_54_A.observation_period`
          GROUP BY person_id
        ) AS p
      INNER JOIN `bio-med-480108.OMOP_54_A.person` 
      ON p.person_id = person.person_id
      LEFT OUTER JOIN `bio-med-480108.OMOP_54_A.concept` 
      ON person.gender_concept_id = concept.concept_id
      WHERE year_of_birth IS NOT NULL
    )

  SELECT
    ordered_data.gender,
    COUNT(*)                                                               AS num_people,
    MIN( age )                                                             AS min_age,
    MAX( age )                                                             AS max_age,
    ROUND( avg( age ), 2 )                                                 AS avg_age,
    ROUND( STDEV( age ), 1 )                                               AS STDEV_age,
    MIN(CASE WHEN order_nr < .25 * population_size THEN 9999 ELSE age END) AS percentile_25,
    MIN(CASE WHEN order_nr < .50 * population_size THEN 9999 ELSE age END) AS median,
    MIN(CASE WHEN order_nr < .75 * population_size THEN 9999 ELSE age END) AS percentile_75
  FROM 
   ( SELECT 
      gender                                                               AS gender,
      age                                                                  AS age,
      ROW_NUMBER() OVER (PARTITION BY gender ORDER BY age)                 AS  order_nr
    FROM t
  ) AS ordered_data
  INNER JOIN 
   ( SELECT gender,
      COUNT(*) AS population_size
     FROM t
     GROUP BY gender
  ) AS population_sizes
   ON ordered_data.gender = population_sizes.gender
  GROUP BY ordered_data.gender;
concept_ids_gold_standard: ""
