id_evaluacion: "querylibrary_CO05"
nivel_complejidad: "compleja"
domain_main: "condition_occurrence"
domain_others: "person, concept"
pregunta_lenguaje_natural: >-
  Desglosar el número de pacientes diagnosticados con náuseas según su género y rango de edad.
sql_base_gold_standard: |
  SELECT
    concept_name AS gender,
    age,
    gender_age_freq
  FROM 
    (SELECT
      gender_concept_id,
      age,
      COUNT(1) gender_age_freq
     FROM 
      (SELECT
        year_of_birth,
        month_of_birth,
        day_of_birth,
        gender_concept_id,
        condition_start_date,
        YEAR(condition_start_date) - year_of_birth    AS age
       FROM 
        (SELECT
          person_id,
          condition_start_date
         FROM `bio-med-480108.OMOP_54_A.condition_occurrence`
         WHERE condition_concept_id = 31967 -- Input condition_concept_id 
               AND person_id IS NOT NULL
        ) AS from_cond
      LEFT JOIN `bio-med-480108.OMOP_54_A.person` from_person 
        ON from_cond.person_id=from_person.person_id 
    ) AS gender_count
    GROUP BY
      gender_concept_id,
      age
    ) AS gender_id_age_count
  LEFT JOIN `bio-med-480108.OMOP_54_A.concept` concept_list 
    ON gender_id_age_count.gender_concept_id=concept_list.concept_id
  ORDER BY gender_age_freq DESC;
concept_ids_gold_standard: "31967"
