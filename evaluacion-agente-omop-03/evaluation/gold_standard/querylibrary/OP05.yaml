id_evaluacion: "querylibrary_OP05"
nivel_complejidad: "baja"
domain_main: "observation_period"
domain_others: ""
pregunta_lenguaje_natural: >-
  Calcular la duración promedio en meses de los períodos de observación clínica en la base de datos.
sql_base_gold_standard: |
  SELECT 
    FLOOR(AVG(DATEDIFF(day, observation_period_start_date, observation_period_end_date)/30)) AS num_months
  FROM `bio-med-480108.OMOP_54_A.observation_period`;
concept_ids_gold_standard: ""
