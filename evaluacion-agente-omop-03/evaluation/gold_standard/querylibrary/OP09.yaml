id_evaluacion: "querylibrary_OP09"
nivel_complejidad: "intermedia"
domain_main: "observation_period"
domain_others: ""
pregunta_lenguaje_natural: >-
  Contar cuántos pacientes tienen un número específico de períodos de observación registrados en la base de datos.
sql_base_gold_standard: |
  SELECT p.person_id, count(1) observation_period_count
  FROM `bio-med-480108.OMOP_54_A.observation_period` p
  GROUP BY p.person_id
  having count(1) = 3;
