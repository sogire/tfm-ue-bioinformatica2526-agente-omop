sql_generada_agente: |-
  WITH patientdiagnosiscounts AS
    (SELECT person_id,
            count(DISTINCT condition_concept_id) AS distinct_diagnosis_count
     FROM `condition_occurrence`
     GROUP BY person_id),
       aggregatedstatistics AS
    (SELECT avg(distinct_diagnosis_count) AS mean_diagnoses,
            stddev(distinct_diagnosis_count) AS stddev_diagnoses,
            min(distinct_diagnosis_count) AS min_diagnoses,
            max(distinct_diagnosis_count) AS max_diagnoses,
            approx_quantiles(distinct_diagnosis_count, 100)[offset(25)] AS q1_diagnoses,
            approx_quantiles(distinct_diagnosis_count, 100)[offset(50)] AS median_diagnoses,
            approx_quantiles(distinct_diagnosis_count, 100)[offset(75)] AS q3_diagnoses,
            count(*) AS total_patients
     FROM patientdiagnosiscounts),
       calculatedoutlierbounds AS
    (SELECT mean_diagnoses,
            stddev_diagnoses,
            min_diagnoses,
            max_diagnoses,
            q1_diagnoses,
            median_diagnoses,
            q3_diagnoses,
            (q3_diagnoses - q1_diagnoses) AS iqr_diagnoses,
            (q1_diagnoses - 1.5 * (q3_diagnoses - q1_diagnoses)) AS lower_bound_outlier,
            (q3_diagnoses + 1.5 * (q3_diagnoses - q1_diagnoses)) AS upper_bound_outlier
     FROM aggregatedstatistics)
  SELECT cast(cb.mean_diagnoses AS float64) AS mean_diagnoses,
         cast(cb.stddev_diagnoses AS float64) AS stddev_diagnoses,
         cast(cb.min_diagnoses AS BIGNUMERIC) AS min_diagnoses,
         cast(cb.max_diagnoses AS BIGNUMERIC) AS max_diagnoses,
         cast(cb.q1_diagnoses AS float64) AS q1_diagnoses,
         cast(cb.median_diagnoses AS float64) AS median_diagnoses,
         cast(cb.q3_diagnoses AS float64) AS q3_diagnoses,
         cast(cb.iqr_diagnoses AS float64) AS iqr_diagnoses,
         cast(cb.lower_bound_outlier AS float64) AS lower_bound_outlier,
         cast(cb.upper_bound_outlier AS float64) AS upper_bound_outlier,

    (SELECT count(1)
     FROM patientdiagnosiscounts pdc
     WHERE pdc.distinct_diagnosis_count < cb.lower_bound_outlier
       OR pdc.distinct_diagnosis_count > cb.upper_bound_outlier) AS count_outliers
  FROM calculatedoutlierbounds cb;
