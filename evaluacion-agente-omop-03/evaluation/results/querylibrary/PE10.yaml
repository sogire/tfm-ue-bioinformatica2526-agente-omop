sql_generada_agente: |-
  SELECT p.month_of_birth,
         p.day_of_birth,
         count(DISTINCT p.person_id) AS patient_count
  FROM person AS p
  WHERE p.month_of_birth IS NOT NULL
    AND p.day_of_birth IS NOT NULL
  GROUP BY p.month_of_birth,
           p.day_of_birth
  ORDER BY p.month_of_birth,
           p.day_of_birth;
