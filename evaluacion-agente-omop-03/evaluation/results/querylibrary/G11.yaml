sql_generada_agente: |-
  SELECT c.concept_id AS child_concept_id,
         c.concept_name AS child_concept_name,
         c.domain_id,
         c.vocabulary_id
  FROM `concept` c
  JOIN `concept_ancestor` ca ON c.concept_id = ca.descendant_concept_id
  WHERE ca.ancestor_concept_id = 192671
    AND ca.min_levels_of_separation = 1
    AND c.standard_concept = 'S'
    AND c.invalid_reason IS NULL;
concept_ids_identificados_agente:
- 192671
