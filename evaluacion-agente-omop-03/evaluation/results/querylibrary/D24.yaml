sql_generada_agente: |-
  SELECT c1.concept_id AS medication_concept_id,
         c1.concept_name AS medication_name,
         c2.concept_id AS brand_concept_id,
         c2.concept_name AS brand_name,
         c2.vocabulary_id AS brand_vocabulary,
         c2.domain_id AS brand_domain
  FROM `concept` AS c1
  JOIN `concept_relationship` AS cr ON c1.concept_id = cr.concept_id_1
  JOIN `concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  WHERE c1.concept_id IN (1516830,
                          19046168)
    AND cr.relationship_id = '44818789' -- 'RxNorm has brand name'

    AND c2.standard_concept = 'S'
    AND c2.invalid_reason IS NULL
