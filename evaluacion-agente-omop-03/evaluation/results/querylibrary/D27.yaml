sql_generada_agente: |-
  SELECT DISTINCT brand_name.concept_name AS brand_name,
                  product_drug.concept_id AS product_concept_id,
                  product_drug.concept_name AS product_concept_name,
                  product_drug.concept_class_id AS product_concept_class,
                  product_drug.domain_id,
                  product_drug.vocabulary_id
  FROM `concept` AS brand_name
  JOIN `concept_relationship` AS cr_tradename ON brand_name.concept_id = cr_tradename.concept_id_2
  JOIN `concept` AS drug_with_tradename ON cr_tradename.concept_id_1 = drug_with_tradename.concept_id
  JOIN `concept_relationship` AS cr_product ON drug_with_tradename.concept_id = cr_product.concept_id_1
  JOIN `concept` AS product_drug ON cr_product.concept_id_2 = product_drug.concept_id
  WHERE brand_name.concept_id = 19011505
    AND brand_name.concept_class_id = 'Brand Name'
    AND cr_tradename.relationship_id = 'Has tradename'
    AND cr_tradename.valid_start_date <= current_date()
    AND cr_tradename.valid_end_date >= current_date()
    AND cr_product.relationship_id IN ('RxNorm has ing',
                                       'Constitutes')
    AND product_drug.concept_class_id IN ('Clinical Drug',
                                          'Branded Drug',
                                          'Quantified Clinical Drug',
                                          'Clinical Drug Form',
                                          'Branded Drug Form')
    AND cr_product.valid_start_date <= current_date()
    AND cr_product.valid_end_date >= current_date()
