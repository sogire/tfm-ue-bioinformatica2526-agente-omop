sql_generada_agente: |-
  SELECT extract(YEAR
                 FROM drug_exposure_start_date) AS YEAR,
         extract(MONTH
                 FROM drug_exposure_start_date) AS MONTH,
         count(*) AS drug_exposure_count
  FROM drug_exposure
  WHERE extract(MONTH
                FROM drug_exposure_start_date) IN (3,
                                                   5)
  GROUP BY YEAR,
           MONTH
  ORDER BY YEAR,
           MONTH;
