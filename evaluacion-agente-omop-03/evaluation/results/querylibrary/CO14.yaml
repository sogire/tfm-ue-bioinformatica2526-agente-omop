sql_generada_agente: |-
  SELECT co.condition_type_concept_id,
         c.concept_name AS condition_type_name,
         count(co.condition_occurrence_id) AS occurrence_count
  FROM `condition_occurrence` AS co
  JOIN `concept` AS c ON co.condition_type_concept_id = c.concept_id
  WHERE co.condition_concept_id IN (27674,
                                    31967,
                                    1245082)
  GROUP BY co.condition_type_concept_id,
           c.concept_name
  ORDER BY occurrence_count DESC;
