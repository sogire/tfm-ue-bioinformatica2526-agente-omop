sql_generada_agente: |-
  SELECT stop_reason,
         count(*) AS frequency
  FROM `drug_exposure`
  WHERE stop_reason IS NOT NULL
    AND stop_reason != ''
  GROUP BY stop_reason
  ORDER BY frequency DESC
  LIMIT 10
