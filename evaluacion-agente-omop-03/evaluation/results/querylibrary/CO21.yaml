sql_generada_agente: |-
  SELECT co.condition_concept_id,
         c.concept_name,
         cast(avg(extract(YEAR
                          FROM co.condition_start_date) - p.year_of_birth) AS float64) AS mean_age_at_diagnosis,
         cast(stddev(extract(YEAR
                             FROM co.condition_start_date) - p.year_of_birth) AS float64) AS stddev_age_at_diagnosis,
         cast(min(extract(YEAR
                          FROM co.condition_start_date) - p.year_of_birth) AS float64) AS min_age_at_diagnosis,
         cast(max(extract(YEAR
                          FROM co.condition_start_date) - p.year_of_birth) AS float64) AS max_age_at_diagnosis,
         cast(approx_quantiles(extract(YEAR
                                       FROM co.condition_start_date) - p.year_of_birth, 100)[offset(25)] AS float64) AS p25_age_at_diagnosis,
         cast(approx_quantiles(extract(YEAR
                                       FROM co.condition_start_date) - p.year_of_birth, 100)[offset(50)] AS float64) AS p50_age_at_diagnosis,
         cast(approx_quantiles(extract(YEAR
                                       FROM co.condition_start_date) - p.year_of_birth, 100)[offset(75)] AS float64) AS p75_age_at_diagnosis
  FROM `condition_occurrence` AS co
  JOIN `person` AS p ON co.person_id = p.person_id
  JOIN `concept` AS c ON co.condition_concept_id = c.concept_id
