sql_generada_agente: |-
  SELECT c.concept_name AS specialty_name,
         count(*) AS total_prescriptions_count
  FROM drug_exposure AS de
  JOIN provider AS p ON de.provider_id = p.provider_id
  JOIN concept AS c ON p.specialty_concept_id = c.concept_id
  WHERE de.drug_concept_id IN (2213473,
                               514015,
                               523365,
                               528323)
    AND c.vocabulary_id = 'Specialty'
    AND c.standard_concept = 'S'
  GROUP BY c.concept_name
  ORDER BY total_prescriptions_count DESC;
