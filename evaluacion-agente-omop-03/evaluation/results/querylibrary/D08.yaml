sql_generada_agente: |-
  SELECT c.concept_id AS class_concept_id,
         c.concept_name AS class_concept_name,
         c.concept_code AS class_concept_code,
         c.domain_id AS class_domain_id,
         c.vocabulary_id AS class_vocabulary_id,
         v.vocabulary_name AS class_vocabulary_name,
         c.concept_class_id AS class_concept_class_id,
         ca.min_levels_of_separation
  FROM `concept_ancestor` ca
  JOIN `concept` c ON ca.ancestor_concept_id = c.concept_id
  JOIN `vocabulary` v ON c.vocabulary_id = v.vocabulary_id
  WHERE ca.descendant_concept_id = 1545999
    AND c.vocabulary_id IN ('ATC',
                            'EPC',
                            'NDFRT',
                            'ETC',
                            'VA Class')
    AND c.concept_class_id IN ('ATC',
                               'VA Class',
                               'Mechanism of Action',
                               'Pharmacologic Class',
                               'Therapeutic Class',
                               'Ingredient',
                               'EPC',
                               'ETC')
    AND current_date() BETWEEN c.valid_start_date AND c.valid_end_date;
