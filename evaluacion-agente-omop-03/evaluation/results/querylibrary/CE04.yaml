sql_generada_agente: |-
  SELECT extract(YEAR
                 FROM ce.condition_era_start_date) AS era_year,
         floor(cast((extract(YEAR
                             FROM ce.condition_era_start_date) - p.year_of_birth) / 10 AS BIGNUMERIC)) * 10 AS age_group_start,
         c_gender.concept_name AS gender,
         ce.condition_concept_id,
         c_condition.concept_name AS condition_name,
         count(ce.person_id) AS condition_era_count
  FROM condition_era ce
  JOIN person p ON ce.person_id = p.person_id
  JOIN concept c_gender ON p.gender_concept_id = c_gender.concept_id
  JOIN concept c_condition ON ce.condition_concept_id = c_condition.concept_id
  GROUP BY 1,
           2,
           3,
           4,
           5
  ORDER BY 1,
           2,
           3,
           4,
           5;
