sql_generada_agente: |-
  WITH angioedemaconcepts AS
    (-- Obtener todos los conceptos descendientes de 'Angioedema' (Concept ID: 432791)
   SELECT DISTINCT descendant_concept_id
     FROM `concept_ancestor`
     WHERE ancestor_concept_id = 432791 -- Concept ID para 'Angioedema'
  ),
       angioedematreatmentdrugconcepts AS
    (-- Fármacos y sus descendientes que se consideran terapia para el angioedema.
   -- Se utilizan conceptos de ingredientes clave y se incluyen todos sus descendientes (formas, dosis, combinaciones).
   SELECT DISTINCT ca.descendant_concept_id AS drug_concept_id
     FROM `concept_ancestor` ca
     WHERE ca.ancestor_concept_id IN (45892906, -- C1 esterase inhibitor (RxNorm Ingredient)
   40242044, -- icatibant (RxNorm Ingredient)
   1129625, -- diphenhydramine (RxNorm Ingredient)
   1551099 -- prednisone (RxNorm Ingredient)
   -- Añadir aquí otros CONCEPT_ID de ingredientes RxNorm relevantes para el tratamiento del angioedema
   )-- Asegurar que los descendientes sean realmente conceptos de fármacos

       AND EXISTS
         (SELECT 1
          FROM `concept` c
          WHERE c.concept_id = ca.descendant_concept_id
            AND c.domain_id = 'Drug'
            AND c.standard_concept = 'S')),
       initialangioedemacohort AS
    (-- Identificar la primera era de angioedema incidente para cada persona,
   -- asegurando períodos de observación válidos y un período de limpieza.
   SELECT p.person_id,
          min(ce.condition_era_start_date) AS index_date,
          op.observation_period_start_date,
          op.observation_period_end_date
     FROM `person` p
     JOIN `condition_era` ce ON p.person_id = ce.person_id
     JOIN angioedemaconcepts ac ON ce.condition_concept_id = ac.descendant_concept_id
     JOIN `observation_period` op ON p.person_id = op.person_id
     WHERE -- Asegurar que la era de la condición caiga dentro de un período de observación
   ce.condition_era_start_date BETWEEN op.observation_period_start_date AND op.observation_period_end_date
       AND -- Período de limpieza: al menos 365 días de observación previa continua sin un diagnóstico de angioedema
   date_diff(ce.condition_era_start_date, op.observation_period_start_date, DAY) >= 365
       AND NOT EXISTS
         (SELECT 1
          FROM `condition_era` ce_prev
          JOIN angioedemaconcepts ac_prev ON ce_prev.condition_concept_id = ac_prev.descendant_concept_id
          WHERE ce_prev.person_id = p.person_id
            AND ce_prev.condition_era_start_date < ce.condition_era_start_date
            AND ce_prev.condition_era_start_date >= date_sub(ce.condition_era_start_date, INTERVAL 365 DAY))
     GROUP BY p.person_id,
              op.observation_period_start_date,
              op.observation_period_end_date
     HAVING -- Asegurar un período de seguimiento suficiente (ej. 30 días) después del diagnóstico inicial
   date_diff(op.observation_period_end_date, min(ce.condition_era_start_date), DAY) >= 30),
       firstlinetreatmentperperson AS
    (-- Identificar el primer fármaco de tratamiento para angioedema para CADA persona después de la fecha índice
   SELECT coh.person_id,
          de.drug_concept_id,
          row_number() OVER (PARTITION BY coh.person_id
                             ORDER BY de.drug_exposure_start_date) AS rn
     FROM initialangioedemacohort coh
     JOIN `drug_exposure` de ON coh.person_id = de.person_id
     JOIN angioedematreatmentdrugconcepts atdc ON de.drug_concept_id = atdc.drug_concept_id
     WHERE de.drug_exposure_start_date >= coh.index_date
       AND de.drug_exposure_start_date BETWEEN coh.observation_period_start_date AND coh.observation_period_end_date) -- Agregación: Contar las terapias de primera línea más comunes

  SELECT c.concept_name AS first_line_treatment_drug_name,
         count(DISTINCT flt.person_id) AS number_of_patients,
         cast(count(DISTINCT flt.person_id) * 100.0 /
                (SELECT count(DISTINCT person_id)
                 FROM initialangioedemacohort) AS BIGNUMERIC) AS percentage_of_patients
  FROM firstlinetreatmentperperson flt
  JOIN `concept` c ON flt.drug_concept_id = c.concept_id
  WHERE flt.rn = 1 -- Solo el primer tratamiento
  GROUP BY c.concept_name
  ORDER BY number_of_patients DESC;
