sql_generada_agente: |-
  SELECT l.state,
         count(DISTINCT p.person_id) AS patient_count
  FROM `person` AS p
  JOIN `location` AS l ON p.location_id = l.location_id
  GROUP BY l.state
  ORDER BY l.state;
