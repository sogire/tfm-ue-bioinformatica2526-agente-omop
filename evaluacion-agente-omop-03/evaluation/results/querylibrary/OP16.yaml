sql_generada_agente: |-
  WITH personfirstobservation AS
    (SELECT person_id,
            min(observation_period_start_date) AS first_observation_start_date
     FROM observation_period
     GROUP BY person_id)
  SELECT p.gender_concept_id,
         vc.concept_name AS gender_concept_name,
         extract(YEAR
                 FROM pfo.first_observation_start_date) AS observation_year,
         trunc(date_diff(pfo.first_observation_start_date, date(p.year_of_birth, p.month_of_birth, p.day_of_birth), YEAR) / 10) * 10 AS age_band_start,
         (trunc(date_diff(pfo.first_observation_start_date, date(p.year_of_birth, p.month_of_birth, p.day_of_birth), YEAR) / 10) * 10) + 9 AS age_band_end,
         count(DISTINCT p.person_id) AS number_of_patients
  FROM person AS p
  JOIN personfirstobservation AS pfo ON p.person_id = pfo.person_id
  JOIN concept AS vc ON p.gender_concept_id = vc.concept_id
  GROUP BY p.gender_concept_id,
           gender_concept_name,
           observation_year,
           age_band_start,
           age_band_end
  ORDER BY observation_year,
           gender_concept_name,
           age_band_start
