sql_generada_agente: |-
  SELECT DISTINCT de.drug_concept_id,
                  c.concept_name
  FROM `drug_exposure` AS de
  JOIN `concept` AS c ON de.drug_concept_id = c.concept_id
  WHERE c.domain_id = 'Drug'
    AND c.standard_concept = 'S'
  ORDER BY c.concept_name;
