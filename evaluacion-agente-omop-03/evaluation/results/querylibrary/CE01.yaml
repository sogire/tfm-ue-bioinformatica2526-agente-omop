sql_generada_agente: |-
  WITH back_pain_concepts AS
    (SELECT ca.descendant_concept_id
     FROM `concept_ancestor` ca
     JOIN `concept` c ON ca.ancestor_concept_id = c.concept_id
     WHERE c.vocabulary_id = 'SNOMED'
       AND c.concept_code = '161891005' -- Concept code for 'back pain'

       AND c.standard_concept = 'S'),
       surgery_procedures AS
    (SELECT po.person_id,
            po.procedure_date,
            1 AS surgery_flag
     FROM `procedure_occurrence` po
     JOIN `concept` c ON po.procedure_concept_id = c.concept_id
     WHERE c.vocabulary_id = 'CPT4'
       AND c.concept_code IN ('22851',
                              '20936',
                              '22525')-- Example CPT4 codes for surgery
  ),
       pharmaceutical_procedures AS
    (SELECT po.person_id,
            po.procedure_date,
            1 AS drug_procedure_flag
     FROM `procedure_occurrence` po
     JOIN `concept` c ON po.procedure_concept_id = c.concept_id
     WHERE c.vocabulary_id = 'CPT4'
       AND c.concept_code IN ('20610',
                              '20552',
                              '23350')-- Example CPT4 codes for pharmacological procedures
  ),
       drug_eras AS
    (SELECT de.person_id,
            de.drug_era_start_date AS drug_date,
            1 AS drug_era_flag
     FROM `drug_era` de
     WHERE de.drug_concept_id IN (1125315,
                                  778711,
                                  1115008,
                                  1125315,
                                  1177480,
                                  1506270)-- User-provided drug concept IDs
  ),
       physiotherapy_procedures AS
    (SELECT po.person_id,
            po.procedure_date,
            1 AS pt_flag
     FROM `procedure_occurrence` po
     JOIN `concept` c ON po.procedure_concept_id = c.concept_id
     WHERE (c.vocabulary_id = 'CPT4'
            AND c.concept_code IN ('97001',
                                   '97140',
                                   '97002'))-- Example CPT4 codes for physiotherapy

       OR (c.vocabulary_id = 'HCPCS'
           AND c.concept_code = 'G0283')-- Example HCPCS code for physiotherapy
  ),
       combined_treatment_events AS
    (SELECT person_id,
            procedure_date AS event_date,
            'surgery' AS treatment_type
     FROM surgery_procedures
     UNION ALL SELECT person_id,
                      procedure_date AS event_date,
                      'drug_procedure' AS treatment_type
     FROM pharmaceutical_procedures
     UNION ALL SELECT person_id,
                      drug_date AS event_date,
                      'drug_era' AS treatment_type
     FROM drug_eras
     UNION ALL SELECT person_id,
                      procedure_date AS event_date,
                      'physiotherapy' AS treatment_type
     FROM physiotherapy_procedures)
  SELECT CASE
             WHEN s.surgery_flag = 1 THEN 'Surgery'
             WHEN dp.drug_procedure_flag = 1
                  OR dr.drug_era_flag = 1 THEN 'Rx Only'
             WHEN pt.pt_flag = 1 THEN 'PT Rx'
             ELSE 'No Treatment'
         END AS treatment,
         count(DISTINCT ce.person_id) AS patient_count,
         count(*) AS condition_era_count,
         min(date_diff(ce.condition_era_end_date, ce.condition_era_start_date, DAY)) AS min_condition_days,
         max(date_diff(ce.condition_era_end_date, ce.condition_era_start_date, DAY)) AS max_condition_days,
         avg(cast(date_diff(ce.condition_era_end_date, ce.condition_era_start_date, DAY) AS BIGNUMERIC)) AS avg_condition_days
  FROM `condition_era` ce
  INNER JOIN back_pain_concepts bpc ON ce.condition_concept_id = bpc.descendant_concept_id
  LEFT JOIN
    (SELECT person_id,
            event_date,
            surgery_flag
     FROM combined_treatment_events
     WHERE treatment_type = 'surgery') s ON ce.person_id = s.person_id
  AND s.event_date BETWEEN ce.condition_era_start_date AND date_add(ce.condition_era_start_date, INTERVAL 60 DAY)
  LEFT JOIN
    (SELECT person_id,
            event_date,
            drug_procedure_flag
     FROM combined_treatment_events
     WHERE treatment_type = 'drug_procedure') dp ON ce.person_id = dp.person_id
  AND dp.event_date BETWEEN ce.condition_era_start_date AND date_add(ce.condition_era_start_date, INTERVAL 60 DAY)
  LEFT JOIN
    (SELECT person_id,
            event_date,
            drug_era_flag
     FROM combined_treatment_events
     WHERE treatment_type = 'drug_era') dr ON ce.person_id = dr.person_id
  AND dr.event_date BETWEEN ce.condition_era_start_date AND date_add(ce.condition_era_start_date, INTERVAL 60 DAY)
  LEFT JOIN
    (SELECT person_id,
            event_date,
            pt_flag
     FROM combined_treatment_events
     WHERE treatment_type = 'physiotherapy') pt ON ce.person_id = pt.person_id
  AND pt.event_date BETWEEN ce.condition_era_start_date AND date_add(ce.condition_era_start_date, INTERVAL 60 DAY)
  GROUP BY treatment
  ORDER BY treatment;
