sql_generada_agente: |-
  SELECT ca.ancestor_concept_id,
         c.concept_name AS ancestor_concept_name,
         c.domain_id AS ancestor_domain,
         c.concept_code,
         c.concept_class_id,
         c.vocabulary_id,
         ca.min_levels_of_separation,
         ca.max_levels_of_separation
  FROM `concept_ancestor` AS ca
  JOIN `concept` AS c ON ca.ancestor_concept_id = c.concept_id
  WHERE ca.descendant_concept_id = 192671
    AND ca.ancestor_concept_id != 192671
    AND c.invalid_reason IS NULL
  ORDER BY ca.min_levels_of_separation DESC,
           c.concept_name;
