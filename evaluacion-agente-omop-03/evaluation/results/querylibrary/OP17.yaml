sql_generada_agente: |-
  SELECT extract(MONTH
                 FROM op.observation_period_end_date) AS end_month,
         CASE
             WHEN d.person_id IS NOT NULL
                  AND d.death_date <= op.observation_period_end_date THEN 'Deceased'
             ELSE 'Alive at end of period'
         END AS closure_condition,
         count(op.observation_period_id) AS num_observation_periods
  FROM `observation_period` AS op
  LEFT JOIN `death` AS d ON op.person_id = d.person_id
  GROUP BY end_month,
           closure_condition
  ORDER BY end_month,
           closure_condition
