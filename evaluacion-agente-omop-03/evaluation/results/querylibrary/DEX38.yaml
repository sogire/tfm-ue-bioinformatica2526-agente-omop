sql_generada_agente: |-
  SELECT t1.stop_reason,
         count(*) AS reason_count
  FROM `drug_exposure` AS t1
  WHERE t1.stop_reason IS NOT NULL
    AND t1.stop_reason != ''
  GROUP BY t1.stop_reason
  ORDER BY reason_count DESC;
