sql_generada_agente: |-
  SELECT de.person_id,
         count(de.drug_exposure_id) AS drug_exposure_count
  FROM drug_exposure AS de
  JOIN concept AS c ON de.drug_concept_id = c.concept_id
  WHERE c.domain_id = 'Drug'
    AND c.standard_concept = 'S'
    AND de.drug_exposure_start_date >= '2000-01-01'
    AND de.drug_exposure_start_date <= '2023-12-31' -- Reemplazar con el rango de fechas deseado
  GROUP BY de.person_id
  ORDER BY drug_exposure_count DESC
  LIMIT 1
