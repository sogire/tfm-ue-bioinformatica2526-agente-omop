sql_generada_agente: |-
  SELECT num_drug_eras,
         count(person_id) AS num_patients
  FROM
    (SELECT person_id,
            count(drug_era_start_date) AS num_drug_eras
     FROM `drug_era`
     GROUP BY person_id) AS drug_era_counts
  WHERE num_drug_eras IN (3,
                          4)
  GROUP BY num_drug_eras
  ORDER BY num_drug_eras
