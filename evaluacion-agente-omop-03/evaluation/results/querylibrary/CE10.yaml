sql_generada_agente: |-
  SELECT ce.condition_concept_id,
         c.concept_name,
         count(DISTINCT ce.person_id) AS person_count
  FROM `condition_era` AS ce
  JOIN `concept` AS c ON ce.condition_concept_id = c.concept_id
  WHERE ce.condition_concept_id IN (256723,
                                    372906,
                                    435371,
                                    440377,
                                    441202)
  GROUP BY ce.condition_concept_id,
           c.concept_name
  ORDER BY person_count DESC
