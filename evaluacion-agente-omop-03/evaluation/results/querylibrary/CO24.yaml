sql_generada_agente: |-
  SELECT co.condition_concept_id,
         cc.concept_name AS condition_name,
         p.gender_concept_id,
         gc.concept_name AS gender_name,
         count(DISTINCT p.person_id) AS patient_count
  FROM person AS p
  JOIN condition_occurrence AS co ON p.person_id = co.person_id
  JOIN concept AS gc ON p.gender_concept_id = gc.concept_id
  JOIN concept AS cc ON co.condition_concept_id = cc.concept_id
  WHERE gc.concept_name IN ('Male',
                            'Female')
  GROUP BY co.condition_concept_id,
           cc.concept_name,
           p.gender_concept_id,
           gc.concept_name
  ORDER BY condition_name,
           gender_name;
