sql_generada_agente: |-
  SELECT format_date('%Y-%m', condition_start_date) AS observation_month,
         count(condition_occurrence_id) AS condition_count
  FROM condition_occurrence
  GROUP BY observation_month
  ORDER BY observation_month;
