    justificacion_gemini: |-
      Para alinear la consulta con el estándar de oro, el agente debe formular la siguiente lógica:

      **Tablas:**
      1.  `condition_era`: Para obtener la fecha de inicio del diagnóstico (`condition_era_start_date`) y el identificador del paciente (`person_id`).
      2.  `death`: Para obtener la fecha de fallecimiento (`death_date`) y el `person_id` del paciente.
      3.  `concept_ancestor` y `concept` (o equivalente si se usa `search_omop_official_concepts`): Para identificar los `concept_id`s relacionados con 'Infarto Agudo de Miocardio' y sus descendientes.
      4.  `observation_period`: Para validar que el diagnóstico cae dentro de un período de observación y aplicar filtros de temporalidad.

      **Condiciones de Unión (JOINs):**
      1.  `condition_era` `INNER JOIN` `death` `ON condition_era.person_id = death.person_id`.
      2.  `condition_era` `INNER JOIN` `observation_period` `ON condition_era.person_id = observation_period.person_id`.
      3.  `condition_era.condition_concept_id` debe unirse implícita o explícitamente con los `concept_id`s identificados para 'Infarto Agudo de Miocardio' (por ejemplo, a través de una subconsulta de `concept_ancestor`).

      **Filtros (WHERE):**
      1.  Filtrar `condition_era` por los `concept_id`s de 'Infarto Agudo de Miocardio' (incluyendo descendientes si aplica, como en el gold standard).
      2.  Seleccionar solo el diagnóstico inicial (`condition_era_start_date`) para cada paciente utilizando una función de ventana (`RANK() OVER (PARTITION BY person_id ORDER BY condition_era_start_date) = 1`).
      3.  Asegurarse de que `condition_era_start_date` sea al menos 180 días posterior al `observation_period_start_date` (`condition_era_start_date >= DATE_ADD(observation_period_start_date, INTERVAL 180 DAY)`).
