sql_generada_agente: |-
  SELECT extract(MONTH
                 FROM drug_era_start_date) AS observation_month,
         count(1) AS active_drug_era_episodes
  FROM drug_era
  WHERE extract(MONTH
                FROM drug_era_start_date) IN (3,
                                              5)
  GROUP BY extract(MONTH
                   FROM drug_era_start_date)
  ORDER BY observation_month
