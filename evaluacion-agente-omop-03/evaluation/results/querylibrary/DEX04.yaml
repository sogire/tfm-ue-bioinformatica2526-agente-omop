sql_generada_agente: |-
  SELECT c_drug.concept_name AS drug_formulation,
         c_gender.concept_name AS gender,
         count(DISTINCT de.person_id) AS patient_count
  FROM `drug_exposure` AS de
  JOIN `person` AS p ON de.person_id = p.person_id
  JOIN `concept` AS c_gender ON p.gender_concept_id = c_gender.concept_id
  JOIN `concept` AS c_drug ON de.drug_concept_id = c_drug.concept_id
  WHERE de.drug_concept_id IN (40165254,
                               40165258)
  GROUP BY c_drug.concept_name,
           c_gender.concept_name
  ORDER BY drug_formulation,
           patient_count DESC;
