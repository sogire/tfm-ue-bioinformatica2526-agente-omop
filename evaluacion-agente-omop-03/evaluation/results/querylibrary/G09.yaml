sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id,
         c.concept_code,
         c.concept_class_id,
         ca.min_levels_of_separation,
         ca.max_levels_of_separation
  FROM `concept` AS c
  JOIN `concept_ancestor` AS ca ON c.concept_id = ca.descendant_concept_id
  WHERE ca.ancestor_concept_id = 192671
    AND ca.descendant_concept_id != 192671
    AND c.invalid_reason IS NULL
  ORDER BY c.concept_name;
