sql_generada_agente: |-
  SELECT co.person_id,
         cc.concept_name AS condition_name,
         co.condition_start_date AS condition_diagnosis_date,
         'Drug' AS treatment_type,
         cd.concept_name AS treatment_name,
         de.drug_exposure_start_date AS treatment_start_date,
         de.drug_exposure_end_date AS treatment_end_date
  FROM condition_occurrence AS co
  JOIN concept AS cc ON co.condition_concept_id = cc.concept_id
  JOIN drug_exposure AS de ON co.person_id = de.person_id
  JOIN concept AS cd ON de.drug_concept_id = cd.concept_id
  WHERE co.condition_concept_id IN (0)-- Placeholder para la validación

    AND de.drug_exposure_start_date >= co.condition_start_date
    AND de.drug_exposure_start_date <= date_add(co.condition_start_date, INTERVAL 365 DAY) -- Tratamientos en los 365 días posteriores al diagnóstico

  UNION ALL
  SELECT co.person_id,
         cc.concept_name AS condition_name,
         co.condition_start_date AS condition_diagnosis_date,
         'Procedure' AS treatment_type,
         cp.concept_name AS treatment_name,
         po.procedure_date AS treatment_start_date,
         po.procedure_date AS treatment_end_date
  FROM condition_occurrence AS co
  JOIN concept AS cc ON co.condition_concept_id = cc.concept_id
  JOIN procedure_occurrence AS po ON co.person_id = po.person_id
  JOIN concept AS cp ON po.procedure_concept_id = cp.concept_id
  WHERE co.condition_concept_id IN (0)-- Placeholder para la validación

    AND po.procedure_date >= co.condition_start_date
    AND po.procedure_date <= date_add(co.condition_start_date, INTERVAL 365 DAY) -- Procedimientos en los 365 días posteriores al diagnóstico
  ORDER BY person_id,
           condition_diagnosis_date,
           treatment_start_date;
