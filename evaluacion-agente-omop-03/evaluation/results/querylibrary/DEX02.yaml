sql_generada_agente: |-
  SELECT dc.concept_name AS drug_concept_name,
         gc.concept_name AS gender_concept_name,
         extract(YEAR
                 FROM de.drug_exposure_start_date) AS year_of_dispensation,
         CASE
             WHEN (extract(YEAR
                           FROM de.drug_exposure_start_date) - p.year_of_birth) BETWEEN 0 AND 19 THEN '0-19'
             WHEN (extract(YEAR
                           FROM de.drug_exposure_start_date) - p.year_of_birth) BETWEEN 20 AND 39 THEN '20-39'
             WHEN (extract(YEAR
                           FROM de.drug_exposure_start_date) - p.year_of_birth) BETWEEN 40 AND 59 THEN '40-59'
             WHEN (extract(YEAR
                           FROM de.drug_exposure_start_date) - p.year_of_birth) BETWEEN 60 AND 79 THEN '60-79'
             WHEN (extract(YEAR
                           FROM de.drug_exposure_start_date) - p.year_of_birth) >= 80 THEN '80+'
             ELSE 'Unknown'
         END AS age_group,
         count(DISTINCT de.person_id) AS count_of_patients
  FROM `drug_exposure` AS de
  JOIN `person` AS p ON de.person_id = p.person_id
  JOIN `concept` AS dc ON de.drug_concept_id = dc.concept_id
  JOIN `concept` AS gc ON p.gender_concept_id = gc.concept_id
  WHERE de.drug_concept_id IN (40165254,
                               40165258)
  GROUP BY drug_concept_name,
           gender_concept_name,
           year_of_dispensation,
           age_group
  ORDER BY drug_concept_name,
           gender_concept_name,
           year_of_dispensation,
           age_group
