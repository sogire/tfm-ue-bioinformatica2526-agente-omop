sql_generada_agente: |-
  SELECT cast(avg(p.year_of_birth) AS float64) AS mean_year_of_birth,
         cast(stddev(p.year_of_birth) AS float64) AS stddev_year_of_birth,
         min(p.year_of_birth) AS min_year_of_birth,
         approx_quantiles(p.year_of_birth, 100)[offset(25)] AS percentile_25_year_of_birth,
         approx_quantiles(p.year_of_birth, 100)[offset(50)] AS median_year_of_birth,
         approx_quantiles(p.year_of_birth, 100)[offset(75)] AS percentile_75_year_of_birth,
         max(p.year_of_birth) AS max_year_of_birth
  FROM `person` AS p
  WHERE p.year_of_birth IS NOT NULL
