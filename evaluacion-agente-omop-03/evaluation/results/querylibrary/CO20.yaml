sql_generada_agente: |-
  SELECT stop_reason,
         count(*) AS frequency,
         cast(count(*) * 100.0 AS float64) / sum(count(*)) OVER () AS percentage
  FROM condition_occurrence
  WHERE stop_reason IS NOT NULL
  GROUP BY stop_reason
  ORDER BY frequency DESC;
