  SELECT vocabulary_id,
         domain_id,
         concept_class_id,
         standard_concept,
         count(concept_id) AS concept_count
  FROM `concept`
  GROUP BY vocabulary_id,
           domain_id,
           concept_class_id,
           standard_concept
  ORDER BY vocabulary_id,
           domain_id,
           concept_class_id,
           standard_concept;
