sql_generada_agente: |-
  SELECT ce.condition_concept_id,
         min(ce.condition_era_end_date) AS min_end_date,
         max(ce.condition_era_end_date) AS max_end_date,
         date(date_add('1970-01-01', INTERVAL cast(avg(cast(unix_date(ce.condition_era_end_date) AS BIGNUMERIC)) AS int64) DAY)) AS mean_end_date,
         stddev(cast(unix_date(ce.condition_era_end_date) AS BIGNUMERIC)) AS stddev_end_date_days,
         date(date_add('1970-01-01', INTERVAL cast(approx_quantiles(unix_date(ce.condition_era_end_date), 4)[offset(1)] AS int64) DAY)) AS p25_end_date,
         date(date_add('1970-01-01', INTERVAL cast(approx_quantiles(unix_date(ce.condition_era_end_date), 4)[offset(2)] AS int64) DAY)) AS median_end_date,
         date(date_add('1970-01-01', INTERVAL cast(approx_quantiles(unix_date(ce.condition_era_end_date), 4)[offset(3)] AS int64) DAY)) AS p75_end_date
  FROM `condition_era` AS ce
  WHERE ce.condition_concept_id IN (256723,
                                    372906,
                                    435371,
                                    440377,
                                    441202)
  GROUP BY ce.condition_concept_id
