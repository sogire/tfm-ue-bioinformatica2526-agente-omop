    justificacion_gemini: |-
      El agente debe formular una consulta SQL que utilice las tablas `condition_era`, `concept` y `concept_ancestor`. Primero, deberá identificar la cohorte de pacientes con la condición índice ('Diabetes Mellitus Tipo 2' - concept_code '73211009' o el concept_id aprobado por el usuario, e.g., 201826) y su fecha de inicio (`MIN(condition_era_start_date)`), filtrando por `YEAR` y `MONTH` específicos (e.g., 2008 y 1). Luego, deberá identificar todas las condiciones de estos pacientes que *no* sean la condición índice, también filtradas por el mismo `YEAR` y `MONTH`. Las condiciones de unión (JOINs) clave serán entre `condition_era` y `concept_ancestor` (para expandir el concepto de diabetes), y luego un auto-join implícito en `condition_era` para diferenciar la condición índice de las comorbilidades. Los filtros cruciales incluirán `condition_concept_id NOT IN (diabetes_concept_ids)` para las comorbilidades y `comorb.condition_era_start_date > diabetic.onset_date` para asegurar que las comorbilidades sean concurrentes y posteriores a la condición índice. Finalmente, agrupará por `person_id` para contar las comorbilidades (`COUNT(DISTINCT condition_concept_id)`) y calculará la distribución (min, max, avg, percentiles) de estos conteos.
