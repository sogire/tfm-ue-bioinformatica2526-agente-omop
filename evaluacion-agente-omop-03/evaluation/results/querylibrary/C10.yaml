sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id,
         c.concept_class_id
  FROM `concept` AS c
  WHERE c.invalid_reason IS NULL
    AND c.standard_concept = 'S'
    AND lower(c.concept_class_id) = 'body structure'
    AND lower(c.concept_name) LIKE '%heart%'
