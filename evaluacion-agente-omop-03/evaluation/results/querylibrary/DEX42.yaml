sql_generada_agente: |-
  SELECT dc.concept_name AS drug_name,
         g.concept_name AS gender,
         count(DISTINCT p.person_id) AS patient_count
  FROM person p
  JOIN concept g ON p.gender_concept_id = g.concept_id
  JOIN drug_exposure de ON p.person_id = de.person_id
  JOIN concept dc ON de.drug_concept_id = dc.concept_id
  WHERE de.drug_concept_id IN (906805,
                               1517070,
                               19010522)
  GROUP BY dc.concept_name,
           g.concept_name
  ORDER BY drug_name,
           gender;
