sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id,
         c.concept_class_id,
         c.standard_concept,
         c.concept_code,
         c.valid_start_date,
         c.valid_end_date,
         c.invalid_reason
  FROM `concept` AS c
  WHERE lower(c.concept_name) LIKE '%ldl%'
    AND c.domain_id = 'Observation'
    AND c.vocabulary_id IN ('LOINC',
                            'UCUM')
    AND c.standard_concept = 'S'
    AND c.invalid_reason IS NULL
  ORDER BY c.concept_name
