sql_generada_agente: |-
  WITH patientconditioncounts AS
    (SELECT person_id,
            count(condition_occurrence_id) AS condition_count
     FROM `condition_occurrence`
     GROUP BY person_id)
  SELECT cast(avg(condition_count) AS float64) AS mean_condition_records,
         cast(stddev(condition_count) AS float64) AS stddev_condition_records,
         min(condition_count) AS min_condition_records,
         max(condition_count) AS max_condition_records,
         cast(approx_quantiles(condition_count, 4)[offset(1)] AS float64) AS percentile_25_condition_records,
         cast(approx_quantiles(condition_count, 4)[offset(2)] AS float64) AS percentile_50_condition_records,
         cast(approx_quantiles(condition_count, 4)[offset(3)] AS float64) AS percentile_75_condition_records,
         count(person_id) AS condition_num_count
  FROM patientconditioncounts;
