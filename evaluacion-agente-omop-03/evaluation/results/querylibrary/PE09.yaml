sql_generada_agente: |-
  SELECT c.concept_name AS gender,
         p.year_of_birth,
         count(DISTINCT p.person_id) AS patient_count
  FROM `person` AS p
  JOIN `concept` AS c ON p.gender_concept_id = c.concept_id
  GROUP BY c.concept_name,
           p.year_of_birth
  ORDER BY p.year_of_birth,
           c.concept_name;
