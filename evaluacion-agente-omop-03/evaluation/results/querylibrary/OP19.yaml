sql_generada_agente: |-
  SELECT CASE
             WHEN age < 10 THEN '0-9'
             WHEN age >= 10
                  AND age < 20 THEN '10-19'
             WHEN age >= 20
                  AND age < 30 THEN '20-29'
             WHEN age >= 30
                  AND age < 40 THEN '30-39'
             WHEN age >= 40
                  AND age < 50 THEN '40-49'
             WHEN age >= 50
                  AND age < 60 THEN '50-59'
             WHEN age >= 60
                  AND age < 70 THEN '60-69'
             WHEN age >= 70
                  AND age < 80 THEN '70-79'
             WHEN age >= 80
                  AND age < 90 THEN '80-89'
             ELSE '90+'
         END AS age_group,
         count(duration_days) AS observation_period_count,
         min(duration_days) AS min_duration_days,
         max(duration_days) AS max_duration_days,
         avg(cast(duration_days AS float64)) AS avg_duration_days,
         approx_quantiles(duration_days, 100)[offset(25)] AS percentile_25_duration_days,
         approx_quantiles(duration_days, 100)[offset(50)] AS median_duration_days,
         approx_quantiles(duration_days, 100)[offset(75)] AS percentile_75_duration_days
  FROM
    (SELECT p.person_id,
            (extract(YEAR
                     FROM op.observation_period_start_date) - p.year_of_birth) AS age,
            date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) AS duration_days
     FROM `person` AS p
     JOIN `observation_period` AS op ON p.person_id = op.person_id)
  GROUP BY age_group
  ORDER BY age_group
