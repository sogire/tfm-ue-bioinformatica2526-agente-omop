sql_generada_agente: |-
  SELECT gc.concept_name AS gender,
         CASE
             WHEN (extract(YEAR
                           FROM co.condition_start_date) - p.year_of_birth) < 18 THEN '0-17'
             WHEN (extract(YEAR
                           FROM co.condition_start_date) - p.year_of_birth) BETWEEN 18 AND 34 THEN '18-34'
             WHEN (extract(YEAR
                           FROM co.condition_start_date) - p.year_of_birth) BETWEEN 35 AND 54 THEN '35-54'
             WHEN (extract(YEAR
                           FROM co.condition_start_date) - p.year_of_birth) BETWEEN 55 AND 74 THEN '55-74'
             ELSE '75+'
         END AS age_group,
         count(DISTINCT p.person_id) AS patient_count
  FROM `condition_occurrence` AS co
  JOIN `person` AS p ON co.person_id = p.person_id
  JOIN `concept` AS gc ON p.gender_concept_id = gc.concept_id
  WHERE co.condition_concept_id = 31967
  GROUP BY gender,
           age_group
  ORDER BY gender,
           age_group
concept_ids_identificados_agente:
- 31967
