sql_generada_agente: |-
  WITH ami_concepts AS
    (-- Obtener todos los conceptos descendientes de "Acute myocardial infarction" (Concept ID: 312327)
   SELECT descendant_concept_id
     FROM `concept_ancestor`
     WHERE ancestor_concept_id = 312327 -- Concept ID para 'Acute myocardial infarction'
  ),
       ami_cohort_raw AS
    (-- Identificar pacientes y la fecha de inicio de su primera era de IAM
   SELECT ce.person_id,
          min(ce.condition_era_start_date) AS first_ami_era_start_date
     FROM `condition_era` AS ce
     JOIN ami_concepts AS ac ON ce.condition_concept_id = ac.descendant_concept_id
     GROUP BY ce.person_id),
       ami_cohort_filtered AS
    (SELECT acr.person_id,
            acr.first_ami_era_start_date
     FROM ami_cohort_raw AS acr
     JOIN `observation_period` AS op ON acr.person_id = op.person_id
     WHERE -- Asegurar al menos 180 días de observación ANTES del primer diagnóstico de IAM
   date_diff(acr.first_ami_era_start_date, op.observation_period_start_date, DAY) >= 180 -- Asegurar al menos 360 días de observación DESPUÉS del primer diagnóstico de IAM

       AND date_diff(op.observation_period_end_date, acr.first_ami_era_start_date, DAY) >= 360)
  SELECT count(DISTINCT c.person_id) AS total_ami_patients,
         count(DISTINCT CASE
                            WHEN d.death_date IS NOT NULL
                                 AND d.death_date BETWEEN c.first_ami_era_start_date AND date_add(c.first_ami_era_start_date, INTERVAL 360 DAY) THEN c.person_id
                            ELSE NULL
                        END) AS deaths_within_360_days,
         cast(count(DISTINCT CASE
                                 WHEN d.death_date IS NOT NULL
                                      AND d.death_date BETWEEN c.first_ami_era_start_date AND date_add(c.first_ami_era_start_date, INTERVAL 360 DAY) THEN c.person_id
                                 ELSE NULL
                             END) AS float64) * 100.0 / count(DISTINCT c.person_id) AS mortality_rate_360_days
  FROM ami_cohort_filtered AS c
  LEFT JOIN `death` AS d ON c.person_id = d.person_id;
