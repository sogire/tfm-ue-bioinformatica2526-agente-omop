sql_generada_agente: |-
  WITH totalantithrombinpatients AS
    (SELECT count(DISTINCT de.person_id) AS total_persons_in_class
     FROM `drug_era` AS de
     JOIN `concept_ancestor` AS ca ON de.drug_concept_id = ca.descendant_concept_id
     WHERE ca.ancestor_concept_id = 4324992 -- Concept ID for 'Antithrombotics'
  ),
       antithrombindrugpatients AS
    (SELECT de.drug_concept_id,
            c.concept_name AS drug_name,
            count(DISTINCT de.person_id) AS patients_with_drug
     FROM `drug_era` AS de
     JOIN `concept_ancestor` AS ca ON de.drug_concept_id = ca.descendant_concept_id
     JOIN `concept` AS c ON de.drug_concept_id = c.concept_id
     WHERE ca.ancestor_concept_id = 4324992 -- Concept ID for 'Antithrombotics'

     GROUP BY de.drug_concept_id,
              c.concept_name)
  SELECT adp.drug_name,
         adp.patients_with_drug,
         tap.total_persons_in_class,
         cast(adp.patients_with_drug AS BIGNUMERIC) * 100 / tap.total_persons_in_class AS percentage_of_patients
  FROM antithrombindrugpatients AS adp,
       totalantithrombinpatients AS tap
  WHERE tap.total_persons_in_class > 0 -- Avoid division by zero
  ORDER BY percentage_of_patients DESC;
concept_ids_identificados_agente:
- 4324992
