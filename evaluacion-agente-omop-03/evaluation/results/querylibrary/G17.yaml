sql_generada_agente: |-
  SELECT src.vocabulary_id AS source_vocabulary_id,
         count(DISTINCT src.concept_id) AS total_source_drug_concepts,
         count(DISTINCT CASE
                            WHEN EXISTS
                                   (SELECT 1
                                    FROM `concept_relationship` cr
                                    JOIN `concept` target_c ON cr.concept_id_2 = target_c.concept_id
                                    WHERE cr.concept_id_1 = src.concept_id
                                      AND cr.relationship_id = 'Maps to'
                                      AND target_c.standard_concept = 'S'
                                      AND target_c.vocabulary_id = 'RxNorm') THEN src.concept_id
                            ELSE NULL
                        END) AS mapped_to_rxnorm_concepts,
         cast(count(DISTINCT CASE
                                 WHEN EXISTS
                                        (SELECT 1
                                         FROM `concept_relationship` cr
                                         JOIN `concept` target_c ON cr.concept_id_2 = target_c.concept_id
                                         WHERE cr.concept_id_1 = src.concept_id
                                           AND cr.relationship_id = 'Maps to'
                                           AND target_c.standard_concept = 'S'
                                           AND target_c.vocabulary_id = 'RxNorm') THEN src.concept_id
                                 ELSE NULL
                             END) AS float64) * 100.0 / count(DISTINCT src.concept_id) AS percentage_mapped_to_rxnorm
  FROM `concept` AS src
  WHERE src.domain_id = 'Drug'
    AND src.standard_concept IS NULL
    AND src.vocabulary_id != 'RxNorm'
  GROUP BY src.vocabulary_id
  ORDER BY source_vocabulary_id;
