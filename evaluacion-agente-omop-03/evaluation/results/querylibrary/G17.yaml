    justificacion_gemini: |-
      La consulta del agente identifica y filtra correctamente los conceptos de medicamentos fuente no estándar (`src.standard_concept IS NULL`, `src.vocabulary_id != 'RxNorm'`) y los conceptos de RxNorm estándar como objetivo (`target_c.standard_concept = 'S'`, `target_c.vocabulary_id = 'RxNorm'`). Calcula de manera precisa el porcentaje de conceptos fuente que se mapean a RxNorm estándar, lo que es una métrica directa y clínicamente relevante para la 'cobertura de los vocabularios fuente'. La consulta Gold Standard, aunque más granular, introduce una ambigüedad al incluir `ICD9CM` en los vocabularios de destino (`c2.vocabulary_id IN ('ICD9CM','RxNorm')`) y carece de una filtración explícita de `standard_concept = 'S'` para el concepto objetivo en su subconsulta interna, lo que la hace menos directa en la evaluación del mapeo 'al vocabulario estándar de fármacos (RxNorm)'.
