sql_generada_agente: |-
  WITH finasteride_descendants AS
    (SELECT descendant_concept_id
     FROM concept_ancestor
     WHERE ancestor_concept_id = 996416 -- Concept ID for Finasteride
  ),
       finasteride_drug_eras AS
    (SELECT de.person_id,
            de.drug_era_start_date,
            de.drug_era_end_date,
            date_diff(de.drug_era_end_date, de.drug_era_start_date, DAY) + 1 AS era_duration_days,
            de.drug_concept_id AS finasteride_era_concept_id -- The concept_id for the drug era, should be 996416

     FROM drug_era de
     JOIN finasteride_descendants fd ON de.drug_concept_id = fd.descendant_concept_id -- Ensure it's a finasteride era

     WHERE date_diff(de.drug_era_end_date, de.drug_era_start_date, DAY) + 1 > 100 -- Filter for era duration > 100 days
  )
  SELECT fde.person_id,
         fde.drug_era_start_date,
         fde.drug_era_end_date,
         fde.era_duration_days,
         sum(-- Calculate the actual days supplied within the current drug era from individual drug exposures
   -- We cap the days_supply to the era boundaries to ensure no days outside the era are counted
   date_diff(least(dex.drug_exposure_end_date, fde.drug_era_end_date), greatest(dex.drug_exposure_start_date, fde.drug_era_start_date), DAY) + 1) AS total_finasteride_days_supplied_in_era, -- Calculate Proportion of Days Covered (PDC) for this specific drug era
   cast(sum(date_diff(least(dex.drug_exposure_end_date, fde.drug_era_end_date), greatest(dex.drug_exposure_start_date, fde.drug_era_start_date), DAY) + 1) AS float64) / fde.era_duration_days AS proportion_days_covered_in_era
  FROM finasteride_drug_eras fde
  JOIN drug_exposure dex -- Join with individual drug exposures to sum days_supply
   ON fde.person_id = dex.person_id -- Ensure the drug exposure is for finasteride

  JOIN finasteride_descendants fd_exp ON dex.drug_concept_id = fd_exp.descendant_concept_id -- Ensure the drug exposure falls within the boundaries of the drug era

  AND dex.drug_exposure_start_date <= fde.drug_era_end_date
  AND dex.drug_exposure_end_date >= fde.drug_era_start_date
  GROUP BY fde.person_id,
           fde.drug_era_start_date,
           fde.drug_era_end_date,
           fde.era_duration_days
  ORDER BY fde.person_id,
           fde.drug_era_start_date;
