session_file: results/querylibrary/sessions/DEX01.json
turnos_ejecutados: 2
sql_generada_agente: |-
  SELECT c.concept_name AS drug_formulation,
         count(DISTINCT de.person_id) AS number_of_people
  FROM `drug_exposure` AS de
  JOIN `concept` AS c ON de.drug_concept_id = c.concept_id
  WHERE de.drug_concept_id IN (40165254,
                               40165258)
    AND c.domain_id = 'Drug'
    AND c.vocabulary_id = 'RxNorm'
    AND c.standard_concept = 'S'
  GROUP BY c.concept_name,
           de.drug_concept_id
concept_ids_identificados_agente:
- 40165254
- 40165258
