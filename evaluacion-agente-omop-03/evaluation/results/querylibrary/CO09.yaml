sql_generada_agente: |-
  SELECT CASE
             WHEN extract(MONTH
                          FROM co.condition_start_date) BETWEEN 3 AND 5 THEN 'Spring'
             WHEN extract(MONTH
                          FROM co.condition_start_date) BETWEEN 6 AND 8 THEN 'Summer'
             WHEN extract(MONTH
                          FROM co.condition_start_date) BETWEEN 9 AND 11 THEN 'Autumn'
             ELSE 'Winter'
         END AS season,
         count(co.condition_occurrence_id) AS diagnosis_count
  FROM `condition_occurrence` AS co
  WHERE co.condition_concept_id = 31967
  GROUP BY season
  ORDER BY CASE season
               WHEN 'Spring' THEN 1
               WHEN 'Summer' THEN 2
               WHEN 'Autumn' THEN 3
               WHEN 'Winter' THEN 4
           END;
