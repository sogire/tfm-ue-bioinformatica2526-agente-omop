sql_generada_agente: |-
  SELECT de.drug_era_id,
         de.person_id,
         de.drug_concept_id,
         sum(c.total_charge) AS total_economic_cost_era
  FROM `drug_era` AS de
  JOIN `drug_exposure` AS dex ON de.person_id = dex.person_id
  AND dex.drug_exposure_start_date >= de.drug_era_start_date
  AND dex.drug_exposure_end_date <= de.drug_era_end_date
  JOIN `concept_ancestor` AS ca ON ca.ancestor_concept_id = de.drug_concept_id
  AND ca.descendant_concept_id = dex.drug_concept_id
  JOIN `cost` AS c ON dex.drug_exposure_id = c.cost_event_id
  AND c.cost_domain_id = 'Drug'
  GROUP BY de.drug_era_id,
           de.person_id,
           de.drug_concept_id
