      question_improvement: 'Apruebo los conceptos identificados. Teniendo en cuenta
        las siguientes observaciones del evaluador clínico/técnico:


        Para responder a la pregunta clínica, el agente debe formular una consulta
        SQL que utilice las siguientes tablas, condiciones de unión y filtros:


        **Tablas OMOP CDM 5.4 necesarias:**

        1.  `concept_relationship`: Para identificar los mapeos directos desde el
        código fuente.

        2.  `concept`: Utilizada para obtener detalles del concepto fuente, del concepto
        objetivo mapeado y de los conceptos descendientes.

        3.  `concept_ancestor`: Para encontrar todos los conceptos descendientes jerárquicos
        de los conceptos objetivo mapeados.


        **Condiciones de Unión (JOINs) clave:**

        1.  Unir `concept_relationship` con `concept` (como `c1`) en `cr.concept_id_1
        = c1.concept_id` para obtener los detalles del concepto fuente (el código
        ''410.00'').

        2.  Unir `concept_relationship` con `concept` (como `c2`) en `cr.concept_id_2
        = c2.concept_id` para obtener los detalles del concepto objetivo al que se
        mapea directamente el código fuente.

        3.  Unir el resultado de los mapeos directos (o un CTE que los contenga) con
        `concept_ancestor` en `ca.ancestor_concept_id = [concept_id_del_mapeo_directo]`
        para encontrar todos los ancestros (incluido el concepto mismo) que son los
        objetivos de los mapeos directos.

        4.  Unir `concept_ancestor` con `concept` (como `dc`) en `ca.descendant_concept_id
        = dc.concept_id` para obtener los detalles de cada concepto descendiente.


        **Filtros (WHERE) esenciales:**

        1.  Filtrar `concept_relationship` por `relationship_id = ''Maps to''` para
        asegurar que solo se consideren los mapeos directos.

        2.  Filtrar el concepto fuente (`c1`) por `concept_code = ''410.0''` (o ''410.00''
        si el sistema lo normaliza) y `vocabulary_id = ''ICD9CM''` para especificar
        el código fuente y su vocabulario.

        3.  Filtrar `concept_relationship` por `invalid_reason IS NULL` para excluir
        mapeos inválidos.

        4.  Filtrar los conceptos descendientes (`dc`) por `standard_concept = ''S''`
        para asegurar que solo se incluyan conceptos estándar en el resultado final.


        Genera directamente la consulta SQL para BigQuery consultando las tablas del
        modelo OMOP (concept, concept_relationship, concept_ancestor) utilizando los
        concept IDs aprobados.'
