sql_generada_agente: |-
  SELECT dc.concept_id,
         dc.concept_name,
         dc.domain_id,
         dc.vocabulary_id
  FROM `concept_relationship` AS cr
  JOIN `concept` AS c1 ON cr.concept_id_1 = c1.concept_id
  JOIN `concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  JOIN `concept_ancestor` AS ca ON ca.ancestor_concept_id = c2.concept_id
  JOIN `concept` AS dc ON ca.descendant_concept_id = dc.concept_id
  WHERE cr.relationship_id = 'Maps to'
    AND c1.concept_code = '410.0'
    AND c1.vocabulary_id = 'ICD9CM'
    AND cr.invalid_reason IS NULL
    AND dc.standard_concept = 'S';
