sql_generada_agente: |-
  SELECT c1.concept_id AS reference_concept_id,
         c1.concept_name AS reference_concept_name,
         c1.vocabulary_id AS reference_vocabulary_id,
         c1.concept_class_id AS reference_concept_class_id,
         rel.relationship_name,
         c2.concept_id AS generic_formulation_concept_id,
         c2.concept_name AS generic_formulation_concept_name,
         c2.vocabulary_id AS generic_formulation_vocabulary_id,
         c2.concept_class_id AS generic_formulation_concept_class_id,
         c2.standard_concept
  FROM `concept` AS c1
  JOIN `concept_relationship` AS cr ON c1.concept_id = cr.concept_id_1
  JOIN `relationship` AS rel ON cr.relationship_id = rel.relationship_id
  JOIN `concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  WHERE c1.concept_id IN (1396833,
                          19060643)
    AND cr.relationship_id IN ('RxNorm has ingredient',
                               'RxNorm ingredient of',
                               'RxNorm form of',
                               'RxNorm precise ingredient of',
                               'RxNorm has precise ingredient')
    AND c2.vocabulary_id = 'RxNorm'
    AND c2.domain_id = 'Drug'
    AND c2.standard_concept = 'S'
    AND c2.invalid_reason IS NULL
    AND c2.concept_class_id IN ('Ingredient',
                                'Clinical Drug',
                                'Clinical Dose Form Group')
