sql_generada_agente: |-
  WITH patientobservationperiods AS
    (SELECT person_id,
            count(observation_period_id) AS num_observation_periods
     FROM `observation_period`
     GROUP BY person_id)
  SELECT cast(avg(num_observation_periods) AS BIGNUMERIC) AS mean_observation_periods,
         min(num_observation_periods) AS min_observation_periods,
         max(num_observation_periods) AS max_observation_periods,
         approx_quantiles(num_observation_periods, 100)[offset(25)] AS percentile_25,
         approx_quantiles(num_observation_periods, 100)[offset(50)] AS percentile_50,
         approx_quantiles(num_observation_periods, 100)[offset(75)] AS percentile_75
  FROM patientobservationperiods;
