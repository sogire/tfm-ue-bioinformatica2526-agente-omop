sql_generada_agente: |-
  SELECT c.concept_id AS drug_concept_id,
         c.concept_name AS drug_name,
         f.concept_name AS dose_form_name
  FROM `concept_ancestor` ca
  JOIN `concept` c ON ca.descendant_concept_id = c.concept_id
  JOIN `concept_relationship` cr ON c.concept_id = cr.concept_id_1
  JOIN `concept` f ON cr.concept_id_2 = f.concept_id
  WHERE ca.ancestor_concept_id = 4318008 -- Concept ID para 'agonista de receptores hormonales corticosteroides'

    AND c.domain_id = 'Drug'
    AND c.standard_concept = 'S'
    AND cr.relationship_id = 'RxNorm has dose form'
    AND f.concept_name LIKE '%Nasal spray%'
    AND cr.valid_start_date <= current_date()
    AND cr.valid_end_date >= current_date()
concept_ids_identificados_agente:
- 4318008
