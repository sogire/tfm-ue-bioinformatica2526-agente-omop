sql_generada_agente: |-
  SELECT DISTINCT c_drug.concept_id,
                  c_drug.concept_name,
                  c_drug.domain_id,
                  c_drug.vocabulary_id
  FROM `concept` AS c_cond
  JOIN `concept_ancestor` AS ca_cond ON c_cond.concept_id = ca_cond.ancestor_concept_id
  JOIN `concept_relationship` AS cr ON ca_cond.descendant_concept_id = cr.concept_id_1
  JOIN `concept_ancestor` AS ca_drug ON cr.concept_id_2 = ca_drug.ancestor_concept_id
  JOIN `concept` AS c_drug ON ca_drug.descendant_concept_id = c_drug.concept_id
  WHERE c_cond.concept_id IN (253954,
                              73122,
                              78672,
                              80626)
    AND cr.relationship_id IN ('Ind/CI - SNOMED',
                               'SNOMED - ind/CI')
    AND c_drug.vocabulary_id = 'RxNorm'
    AND c_drug.domain_id = 'Drug'
    AND c_drug.standard_concept = 'S'
    AND c_drug.invalid_reason IS NULL
    AND c_cond.valid_start_date <= current_date()
    AND c_cond.valid_end_date >= current_date()
    AND c_drug.valid_start_date <= current_date()
    AND c_drug.valid_end_date >= current_date()
  ORDER BY c_drug.concept_name ;
