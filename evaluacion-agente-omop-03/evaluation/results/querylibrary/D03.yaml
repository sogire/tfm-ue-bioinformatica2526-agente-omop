sql_generada_agente: |-
  SELECT cd.concept_id AS drug_concept_id,
         cd.concept_name AS drug_name,
         cd.domain_id AS drug_domain,
         cd.vocabulary_id AS drug_vocabulary,
         ci.concept_id AS ingredient_concept_id,
         ci.concept_name AS ingredient_name,
         ci.domain_id AS ingredient_domain,
         ci.vocabulary_id AS ingredient_vocabulary
  FROM `concept` AS cd
  JOIN `concept_relationship` AS cr ON cd.concept_id = cr.concept_id_1
  JOIN `concept` AS ci ON cr.concept_id_2 = ci.concept_id
  WHERE cd.concept_id IN (939355,
                          19033566,
                          19102189)
    AND cr.relationship_id = 'RxNorm has ingredient'
    AND ci.standard_concept = 'S'
    AND ci.invalid_reason IS NULL
