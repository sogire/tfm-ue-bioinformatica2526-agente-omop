sql_generada_agente: |-
  SELECT distinct_condition_count,
         count(person_id) AS number_of_patients
  FROM
    (SELECT t1.person_id,
            count(DISTINCT t1.condition_concept_id) AS distinct_condition_count
     FROM `condition_occurrence` AS t1
     WHERE t1.person_id IN
         (SELECT person_id
          FROM `condition_occurrence`
          WHERE condition_concept_id = 201820 -- Diabetes Mellitus
  )
     GROUP BY t1.person_id) AS patient_condition_counts
  GROUP BY distinct_condition_count
  ORDER BY distinct_condition_count;
