sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id,
         c.concept_class_id,
         c.standard_concept,
         c.valid_start_date,
         c.valid_end_date
  FROM `concept_ancestor` ca
  JOIN `concept` c ON ca.descendant_concept_id = c.concept_id
  WHERE ca.ancestor_concept_id = 966991
    AND c.standard_concept = 'S'
    AND c.concept_class_id = 'Branded Drug'
    AND c.valid_end_date > current_date()
  ORDER BY c.concept_name;
