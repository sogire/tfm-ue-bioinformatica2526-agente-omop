sql_generada_agente: |-
  WITH personage AS
    (SELECT p.person_id,
            p.gender_concept_id,
            cast(extract(YEAR
                         FROM first_op.first_obs_start) - p.year_of_birth AS float64) AS age_at_first_observation_start
     FROM person AS p
     JOIN
       (SELECT person_id,
               min(observation_period_start_date) AS first_obs_start
        FROM observation_period
        GROUP BY person_id) AS first_op ON p.person_id = first_op.person_id)
  SELECT gc.concept_name AS gender,
         min(pa.age_at_first_observation_start) AS min_age_at_first_observation,
         max(pa.age_at_first_observation_start) AS max_age_at_first_observation,
         avg(pa.age_at_first_observation_start) AS avg_age_at_first_observation,
         stddev(pa.age_at_first_observation_start) AS stddev_age_at_first_observation,
         approx_quantiles(pa.age_at_first_observation_start, 100)[offset(25)] AS percentile_25,
         approx_quantiles(pa.age_at_first_observation_start, 100)[offset(50)] AS median_age,
         approx_quantiles(pa.age_at_first_observation_start, 100)[offset(75)] AS percentile_75,
         count(pa.person_id) AS total_patients
  FROM personage AS pa
  JOIN concept AS gc ON pa.gender_concept_id = gc.concept_id
  GROUP BY gc.concept_name
  ORDER BY gc.concept_name;
