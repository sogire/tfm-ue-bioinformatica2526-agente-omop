sql_generada_agente: |-
  SELECT de.person_id,
         de.drug_exposure_id,
         de.drug_concept_id,
         de.drug_exposure_start_date,
         de.drug_exposure_end_date,
         de.drug_type_concept_id,
         de.quantity,
         de.days_supply,
         de.sig,
         de.route_concept_id,
         de.refills,
         de.drug_source_value,
         de.drug_source_concept_id,
         de.route_source_value,
         de.dose_unit_source_value
  FROM `drug_exposure` AS de
  JOIN `concept_ancestor` AS ca ON de.drug_concept_id = ca.descendant_concept_id
  JOIN `drug_era` AS der ON de.person_id = der.person_id
  AND ca.ancestor_concept_id = der.drug_concept_id
  WHERE de.drug_exposure_start_date >= der.drug_era_start_date
    AND de.drug_exposure_start_date <= der.drug_era_end_date
    AND der.drug_era_id = 20
  ORDER BY de.person_id,
           de.drug_exposure_start_date;
