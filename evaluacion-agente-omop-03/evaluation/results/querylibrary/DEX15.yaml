    justificacion_gemini: |-
      La consulta del agente replica con alta fidelidad la lógica de negocio del Gold Standard. Identifica correctamente los pacientes expuestos a estatinas, determina la fecha índice y aplica las condiciones de elegibilidad de periodo de observación previo y seguimiento posterior. Se valora positivamente que la consulta del agente emplea funciones de fecha específicas para BigQuery (DATE_SUB, DATE_ADD), a diferencia del Gold Standard que utiliza funciones no estándar en BigQuery (DATEADD, DATEDIFF). La interpretación de los rangos de fechas con operadores '>=' en lugar de '>' por parte del agente es una variación menor y clínicamente razonable para 'al menos N días'. La única diferencia significativa es el nivel de agregación: el Gold Standard estratifica por años de seguimiento, mientras que el agente proporciona un conteo total de pacientes elegibles, lo cual es una respuesta directa a la pregunta 'Contar los pacientes'.
