sql_generada_agente: |-
  SELECT count(DISTINCT de_first.person_id)
  FROM
    (SELECT de.person_id,
            min(de.drug_exposure_start_date) AS index_date
     FROM `drug_exposure` AS de
     JOIN `concept_ancestor` AS ca ON de.drug_concept_id = ca.descendant_concept_id
     WHERE ca.ancestor_concept_id = 1539403 -- Statin (Simvastatin) and its descendants

     GROUP BY de.person_id) AS de_first
  JOIN `observation_period` AS op ON de_first.person_id = op.person_id
  WHERE de_first.index_date >= op.observation_period_start_date
    AND de_first.index_date <= op.observation_period_end_date
    AND op.observation_period_start_date <= date_sub(de_first.index_date, INTERVAL 180 DAY)
    AND op.observation_period_end_date >= date_add(de_first.index_date, INTERVAL 365 DAY)
concept_ids_identificados_agente:
- 1539403
