sql_generada_agente: |-
  SELECT count(DISTINCT de1.person_id)
  FROM drug_exposure de1
  JOIN concept_ancestor ca_statin ON de1.drug_concept_id = ca_statin.descendant_concept_id
  JOIN drug_exposure de2 ON de1.person_id = de2.person_id
  JOIN concept_ancestor ca_diuretic ON de2.drug_concept_id = ca_diuretic.descendant_concept_id
  WHERE ca_statin.ancestor_concept_id = 1539403 -- Estatinas ancestor_concept_id

    AND ca_diuretic.ancestor_concept_id = 974166 -- Diuréticos ancestor_concept_id

    AND de2.drug_exposure_start_date < de1.drug_exposure_end_date
    AND de2.drug_exposure_end_date > de1.drug_exposure_start_date;
concept_ids_identificados_agente:
- 974166
- 1539403
