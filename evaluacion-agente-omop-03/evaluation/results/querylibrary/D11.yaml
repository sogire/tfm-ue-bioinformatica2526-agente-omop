sql_generada_agente: |-
  SELECT -- Ancestor concept details (the class itself)
   anc.concept_id AS ancestor_concept_id,
   anc.concept_name AS ancestor_concept_name,
   anc.vocabulary_id AS ancestor_vocabulary_id,
   anc.concept_code AS ancestor_concept_code, -- Descendant concept details (the individual drug)
   d.concept_id AS descendant_concept_id,
   d.concept_name AS descendant_concept_name,
   d.vocabulary_id AS descendant_vocabulary_id,
   d.concept_code AS descendant_concept_code, -- Source concept details (the NDC code for the descendant drug)
   src_rel.relationship_id AS source_relationship_id,
   src.concept_id AS source_concept_id,
   src.concept_name AS source_concept_name,
   src.vocabulary_id AS source_vocabulary_id,
   src.concept_code AS source_concept_code,
   src_vocab.vocabulary_name AS source_vocabulary_name
  FROM `concept` AS anc -- The ancestor concept (21506108)
  JOIN `concept_ancestor` AS ca ON anc.concept_id = ca.ancestor_concept_id
  JOIN `concept` AS d -- The descendant concept (individual drug)
  ON ca.descendant_concept_id = d.concept_id
  LEFT JOIN `concept_relationship` AS src_rel -- To find source codes for the descendant drug
  ON d.concept_id = src_rel.concept_id_1
  LEFT JOIN `concept` AS src -- The actual source concept (e.g., NDC)
  ON src_rel.concept_id_2 = src.concept_id
  LEFT JOIN `vocabulary` AS src_vocab -- Vocabulary details for the source concept
  ON src.vocabulary_id = src_vocab.vocabulary_id
  WHERE anc.concept_id = 21506108 -- Filter by the provided ancestor concept ID

    AND d.domain_id = 'Drug' -- Ensure descendants are drugs

    AND src_rel.relationship_id = 'Maps to' -- To link to source codes

    AND src.vocabulary_id = 'NDC' -- Specifically looking for NDC codes

    AND d.invalid_reason IS NULL -- Only active descendant concepts

    AND src.invalid_reason IS NULL -- Only active source concepts

    AND src.standard_concept IS NULL -- Source concepts are typically not standard
  ORDER BY descendant_concept_name,
           source_concept_code ;
