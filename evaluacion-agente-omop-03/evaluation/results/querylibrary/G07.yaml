sql_generada_agente: |-
  SELECT c1.concept_id AS source_concept_id,
         c1.concept_name AS source_concept_name,
         c1.domain_id AS source_domain,
         cr.relationship_id,
         c2.concept_id AS related_concept_id,
         c2.concept_name AS related_concept_name,
         c2.domain_id AS related_domain,
         c2.concept_code AS related_concept_code,
         c2.concept_class_id AS related_concept_class_id,
         c2.vocabulary_id AS related_vocabulary_id
  FROM concept c1
  JOIN concept_relationship cr ON c1.concept_id = cr.concept_id_1
  JOIN concept c2 ON cr.concept_id_2 = c2.concept_id
  WHERE c1.concept_id = 192671
    AND cr.invalid_reason IS NULL
  UNION ALL
  SELECT c1.concept_id AS source_concept_id,
         c1.concept_name AS source_concept_name,
         c1.domain_id AS source_domain,
         cr.relationship_id,
         c2.concept_id AS related_concept_id,
         c2.concept_name AS related_concept_name,
         c2.domain_id AS related_domain,
         c2.concept_code AS related_concept_code,
         c2.concept_class_id AS related_concept_class_id,
         c2.vocabulary_id AS related_vocabulary_id
  FROM concept c1
  JOIN concept_relationship cr ON c1.concept_id = cr.concept_id_2
  JOIN concept c2 ON cr.concept_id_1 = c2.concept_id
  WHERE c1.concept_id = 192671
    AND cr.invalid_reason IS NULL;
