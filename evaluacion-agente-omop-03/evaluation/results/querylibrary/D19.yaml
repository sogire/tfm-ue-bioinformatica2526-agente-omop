sql_generada_agente: "SELECT dc.concept_id AS principio_activo_concept_id,\n     \
  \  dc.concept_name AS principio_activo_nombre,\n       dc.vocabulary_id AS principio_activo_vocabulario,\n\
  \       r.relationship_name AS tipo_de_indicacion_medica,\n       cc_ancestor.concept_name\
  \ AS indicado_para_condicion_general,\n       cc_descendant.concept_name AS indicado_para_condicion_especifica\n\
  FROM `concept` AS dc\nJOIN `concept_relationship` AS cr ON dc.concept_id = cr.concept_id_1\n\
  JOIN `relationship` AS r ON cr.relationship_id = r.relationship_id\nJOIN `concept_ancestor`\
  \ AS ca ON cr.concept_id_2 = ca.ancestor_concept_id\nJOIN `concept` AS cc_ancestor\
  \ ON ca.ancestor_concept_id = cc_ancestor.concept_id\nJOIN `concept` AS cc_descendant\
  \ ON ca.descendant_concept_id = cc_descendant.concept_id\nWHERE dc.domain_id = 'Drug'\n\
  \  AND dc.standard_concept = 'S'\n  AND cr.invalid_reason IS NULL\n  AND ca.descendant_concept_id\
  \ = 4345991 -- Concepto de \\'Vomiting\\' (vómitos)\n \n  AND (cr.relationship_id\
  \ IN ('Has therapeutic indication', \n                              'Ind / treatment',\
  \ \n                              'RxNorm - SNOMED therapeutic indication', \n \
  \                             'SNOMED - RxNorm therapeutic indication'))\nORDER\
  \ BY dc.concept_name,\n         r.relationship_name"
