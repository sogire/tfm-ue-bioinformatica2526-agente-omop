sql_generada_agente: |-
  SELECT DISTINCT de.drug_concept_id,
                  c.concept_name,
                  c.domain_id,
                  c.vocabulary_id
  FROM drug_era de
  JOIN concept c ON de.drug_concept_id = c.concept_id
  WHERE c.standard_concept = 'S'
    AND c.invalid_reason IS NULL;
