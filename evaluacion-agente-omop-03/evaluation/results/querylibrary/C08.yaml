sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id,
         c.concept_class_id,
         c.standard_concept
  FROM `concept` AS c
  WHERE c.concept_id = 42900365
    AND c.standard_concept = 'S'
    AND c.invalid_reason IS NULL
    AND c.concept_class_id IN ('pharmaceutical / biologic product',
                               'physical object',
                               'special concept',
                               'event',
                               'physical force',
                               'substance')
