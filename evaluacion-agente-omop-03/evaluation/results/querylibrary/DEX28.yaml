sql_generada_agente: |-
  SELECT de.drug_type_concept_id,
         count(de.drug_exposure_id) AS dispensation_count
  FROM `drug_exposure` AS de
  WHERE de.drug_type_concept_id IN (38000175,
                                    38000180,
                                    43542356)
    AND de.drug_concept_id IN
      (SELECT drug_concept_id
       FROM `drug_era`)
  GROUP BY de.drug_type_concept_id
  ORDER BY dispensation_count DESC;
