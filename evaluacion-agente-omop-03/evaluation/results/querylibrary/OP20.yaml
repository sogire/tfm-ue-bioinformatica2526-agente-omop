sql_generada_agente: |-
  SELECT c.concept_name AS gender,
         min(date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) + 1) AS min_observation_days,
         max(date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) + 1) AS max_observation_days,
         avg(date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) + 1) AS avg_observation_days,
         stddev(date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) + 1) AS stddev_observation_days,
         percentile_cont(date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) + 1, 0.25) OVER (PARTITION BY c.concept_name) AS percentile_25_observation_days,
         percentile_cont(date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) + 1, 0.50) OVER (PARTITION BY c.concept_name) AS median_observation_days,
         percentile_cont(date_diff(op.observation_period_end_date, op.observation_period_start_date, DAY) + 1, 0.75) OVER (PARTITION BY c.concept_name) AS percentile_75_observation_days,
         count(DISTINCT op.person_id) AS number_of_people
  FROM `observation_period` AS op
  JOIN `person` AS p ON op.person_id = p.person_id
  JOIN `concept` AS c ON p.gender_concept_id = c.concept_id
  WHERE p.year_of_birth IS NOT NULL
  GROUP BY c.concept_name
  ORDER BY c.concept_name
