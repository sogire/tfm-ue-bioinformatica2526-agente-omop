sql_generada_agente: |-
  SELECT form_concept.concept_name AS pharmaceutical_form,
         count(DISTINCT de.drug_exposure_id) AS total_dispensations
  FROM `drug_exposure` AS de
  JOIN `concept_ancestor` AS ca ON de.drug_concept_id = ca.descendant_concept_id
  JOIN `concept` AS drug_product_concept ON ca.descendant_concept_id = drug_product_concept.concept_id
  JOIN `concept_relationship` AS cr ON drug_product_concept.concept_id = cr.concept_id_1
  JOIN `concept` AS form_concept ON cr.concept_id_2 = form_concept.concept_id
  WHERE ca.ancestor_concept_id = 1125315 -- Acetaminophen

    AND drug_product_concept.domain_id = 'Drug'
    AND drug_product_concept.vocabulary_id = 'RxNorm'
    AND cr.relationship_id IN ('RxNorm has dose form',
                               'Has dose form')-- Common relationship for dose forms

    AND form_concept.concept_class_id = 'Dose Form' -- Ensure it's a dose form concept
  GROUP BY form_concept.concept_name
  ORDER BY total_dispensations DESC;
concept_ids_identificados_agente:
- 1125315
