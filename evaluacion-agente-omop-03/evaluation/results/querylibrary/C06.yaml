sql_generada_agente: |-
  SELECT c1.concept_id AS target_concept_id,
         c1.concept_name AS target_concept_name,
         c1.vocabulary_id AS target_vocabulary_id,
         c1.concept_code AS target_concept_code,
         c2.concept_id AS source_concept_id,
         c2.concept_name AS source_concept_name,
         c2.vocabulary_id AS source_vocabulary_id,
         c2.concept_code AS source_concept_code
  FROM concept_relationship cr
  JOIN concept c1 ON cr.concept_id_1 = c1.concept_id
  JOIN concept c2 ON cr.concept_id_2 = c2.concept_id
  WHERE cr.relationship_id = 'Mapped from'
    AND c1.concept_id = 312327
    AND c2.invalid_reason IS NULL;
