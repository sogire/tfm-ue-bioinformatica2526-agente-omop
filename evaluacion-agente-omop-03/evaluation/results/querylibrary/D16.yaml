sql_generada_agente: |-
  SELECT DISTINCT drug.concept_id AS drug_concept_id,
                  drug.concept_name AS drug_name,
                  drug.concept_code AS drug_code,
                  indication_relation.relationship_id AS indication_relationship_type
  FROM concept_relationship AS indication_relation
  JOIN concept_ancestor AS a ON a.ancestor_concept_id = indication_relation.concept_id_2
  JOIN concept AS drug ON drug.concept_id = a.descendant_concept_id
  JOIN relationship AS rn ON rn.relationship_id = indication_relation.relationship_id
  WHERE indication_relation.concept_id_1 = 4345991 -- Using Gold Standard Concept ID for 'Vomiting'

    AND drug.domain_id = 'Drug'
    AND drug.standard_concept = 'S'
    AND indication_relation.relationship_id IN ('May treat',
                                                'Is off-label ind of',
                                                'Is FDA-appr ind of',
                                                'Inferred class of',
                                                'May be prevented by',
                                                'May prevent',
                                                'Has FDA-appr ind',
                                                'Has off-label ind',
                                                'May be treated by',
                                                'Has inferred class')
    AND (current_date() >= drug.valid_start_date)
    AND (current_date() <= drug.valid_end_date) ;
