sql_generada_agente: |-
  SELECT c.concept_name AS drug_name,
         avg(cast(extract(YEAR
                          FROM de.drug_era_start_date) - p.year_of_birth AS float64)) AS mean_age,
         stddev(cast(extract(YEAR
                             FROM de.drug_era_start_date) - p.year_of_birth AS float64)) AS stddev_age,
         approx_quantiles(cast(extract(YEAR
                                       FROM de.drug_era_start_date) - p.year_of_birth AS BIGNUMERIC), 100)[offset(25)] AS percentile_25,
         approx_quantiles(cast(extract(YEAR
                                       FROM de.drug_era_start_date) - p.year_of_birth AS BIGNUMERIC), 100)[offset(50)] AS percentile_50,
         approx_quantiles(cast(extract(YEAR
                                       FROM de.drug_era_start_date) - p.year_of_birth AS BIGNUMERIC), 100)[offset(75)] AS percentile_75
  FROM drug_era AS de
  JOIN person AS p ON de.person_id = p.person_id
  JOIN concept AS c ON de.drug_concept_id = c.concept_id
  WHERE de.drug_concept_id IN (1300978,
                               1304643,
                               1549080)
  GROUP BY c.concept_name
  ORDER BY c.concept_name;
