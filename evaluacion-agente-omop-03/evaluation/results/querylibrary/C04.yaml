sql_generada_agente: |-
  SELECT c_meddra.concept_id AS meddra_concept_id,
         c_meddra.concept_name AS meddra_concept_name,
         cr.relationship_id,
         r.relationship_name,
         c_snomed.concept_id AS snomed_concept_id,
         c_snomed.concept_name AS snomed_concept_name,
         c_snomed.domain_id AS snomed_domain_id,
         c_snomed.vocabulary_id AS snomed_vocabulary_id
  FROM concept c_meddra
  JOIN concept_relationship cr ON c_meddra.concept_id = cr.concept_id_1
  JOIN concept c_snomed ON cr.concept_id_2 = c_snomed.concept_id
  JOIN relationship r ON cr.relationship_id = r.relationship_id
  WHERE c_meddra.concept_id = 35205180
    AND cr.relationship_id = 'MedDRA - SNOMED eq'
    AND cr.invalid_reason IS NULL;
