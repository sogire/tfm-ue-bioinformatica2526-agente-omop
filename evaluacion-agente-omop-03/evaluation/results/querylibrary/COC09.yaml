sql_generada_agente: |-
  WITH lymediseasestandardconcepts AS
    (-- Conceptos estándar aprobados por el usuario para la enfermedad de Lyme
   SELECT concept_id
     FROM unnest([440638, 4044930, 4080443, 4080619]) AS concept_id
     UNION DISTINCT -- Conceptos estándar que se mapean desde el código ICD9CM '088.81'
   SELECT c_to.concept_id
     FROM `concept` AS c_from
     JOIN `concept_relationship` AS cr ON c_from.concept_id = cr.concept_id_1
     JOIN `concept` AS c_to ON cr.concept_id_2 = c_to.concept_id
     WHERE c_from.concept_code = '088.81'
       AND c_from.vocabulary_id = 'ICD9CM'
       AND cr.relationship_id = 'Maps to'
       AND c_to.standard_concept = 'S'
       AND c_to.domain_id = 'Condition'),
       lymediseasecasesbyyearstate AS
    (SELECT l.state,
            extract(YEAR
                    FROM ce.condition_era_start_date) AS year_of_diagnosis,
            count(DISTINCT ce.person_id) AS incident_cases_of_lyme_disease
     FROM `condition_era` AS ce
     JOIN `person` AS p ON ce.person_id = p.person_id
     JOIN `location` AS l ON p.location_id = l.location_id
     WHERE ce.condition_era_start_date IS NOT NULL
       AND l.state IS NOT NULL
       AND ce.condition_concept_id IN
         (SELECT concept_id
          FROM lymediseasestandardconcepts)
     GROUP BY l.state,
              year_of_diagnosis),
       yearsinobservation AS
    (SELECT p.person_id,
            l.state,
            y.year_val AS year_of_observation
     FROM `observation_period` AS op
     JOIN `person` AS p ON op.person_id = p.person_id
     JOIN `location` AS l ON p.location_id = l.location_id
     JOIN
       (SELECT year_val
        FROM unnest(generate_array(1900, 2100)) AS year_val) AS y -- Rango de años, ajustar según los datos
   ON y.year_val BETWEEN extract(YEAR
                                 FROM op.observation_period_start_date) AND extract(YEAR
                                                                                    FROM op.observation_period_end_date)
     WHERE l.state IS NOT NULL),
       populationatriskbyyearstate AS
    (SELECT state,
            year_of_observation,
            count(DISTINCT person_id) AS total_person_count_in_year
     FROM yearsinobservation
     GROUP BY state,
              year_of_observation)
  SELECT ldc.state,
         ldc.year_of_diagnosis,
         ldc.incident_cases_of_lyme_disease,
         pars.total_person_count_in_year,
         cast(ldc.incident_cases_of_lyme_disease AS BIGNUMERIC) / pars.total_person_count_in_year * 100000 AS annual_incidence_rate_per_100000
  FROM lymediseasecasesbyyearstate AS ldc
  JOIN populationatriskbyyearstate AS pars ON ldc.state = pars.state
  AND ldc.year_of_diagnosis = pars.year_of_observation
  WHERE pars.total_person_count_in_year > 0
  ORDER BY ldc.state,
           ldc.year_of_diagnosis;
