sql_generada_agente: |-
  SELECT coalesce(d.concept_name, 'Unknown Brand') AS brand_name,
         count(DISTINCT de.drug_exposure_id) AS frequency_of_use
  FROM concept AS a
  LEFT JOIN concept_relationship AS cr003 ON a.concept_id = cr003.concept_id_1
  AND cr003.relationship_id = 'Has tradename'
  LEFT JOIN concept_relationship AS cr007 ON cr003.concept_id_2 = cr007.concept_id_2
  AND cr007.relationship_id = 'Constitutes'
  LEFT JOIN concept_relationship AS cr006 ON cr007.concept_id_1 = cr006.concept_id_1
  AND cr006.relationship_id = 'Has brand name'
  LEFT JOIN concept AS d ON cr006.concept_id_2 = d.concept_id
  AND d.concept_class_id = 'Brand Name'
  LEFT JOIN drug_exposure AS de ON de.drug_concept_id = cr003.concept_id_2
  WHERE a.concept_id IN (35606533,
                         1506270,
                         1506315,
                         1506426)
    AND a.concept_class_id = 'Clinical Drug'
  GROUP BY brand_name
  ORDER BY frequency_of_use DESC;
