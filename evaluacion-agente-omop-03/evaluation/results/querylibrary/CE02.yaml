sql_generada_agente: |-
  SELECT extract(YEAR
                 FROM co.condition_start_date) - p.year_of_birth AS age_at_condition_start,
         gc.concept_name AS gender,
         count(DISTINCT p.person_id) AS patient_count
  FROM `condition_occurrence` AS co
  JOIN `person` AS p ON co.person_id = p.person_id
  JOIN `concept` AS gc ON p.gender_concept_id = gc.concept_id
  WHERE co.condition_concept_id IN
      (SELECT DISTINCT ca.descendant_concept_id
       FROM `concept_ancestor` AS ca
       WHERE ca.ancestor_concept_id = 359817006 -- Closed hip fracture
  )
  GROUP BY age_at_condition_start,
           gender
  ORDER BY age_at_condition_start,
           gender;
