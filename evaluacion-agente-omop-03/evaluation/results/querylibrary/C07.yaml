sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id,
         c.concept_class_id
  FROM `concept` AS c
  WHERE lower(c.concept_name) LIKE lower('%Streptococcus pneumoniae%')
    AND c.concept_class_id = 'Organism'
    AND c.standard_concept = 'S'
    AND c.invalid_reason IS NULL
