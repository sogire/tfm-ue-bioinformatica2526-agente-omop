sql_generada_agente: |-
  SELECT avg(unix_date(t.condition_end_date)) AS avg_condition_end_date_days_since_epoch,
         stddev(unix_date(t.condition_end_date)) AS stddev_condition_end_date_days_since_epoch,
         approx_quantiles(unix_date(t.condition_end_date), 100)[offset(25)] AS percentile_25_condition_end_date_days_since_epoch,
         approx_quantiles(unix_date(t.condition_end_date), 100)[offset(50)] AS median_condition_end_date_days_since_epoch,
         approx_quantiles(unix_date(t.condition_end_date), 100)[offset(75)] AS percentile_75_condition_end_date_days_since_epoch
  FROM `condition_occurrence` AS t
  WHERE t.condition_end_date IS NOT NULL
