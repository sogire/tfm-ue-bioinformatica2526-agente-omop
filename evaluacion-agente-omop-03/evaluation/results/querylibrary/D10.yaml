sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.concept_class_id,
         c.concept_code,
         c.vocabulary_id
  FROM `concept` AS c
  JOIN `concept_ancestor` AS ca ON c.concept_id = ca.descendant_concept_id
  WHERE ca.ancestor_concept_id = 21506108
    AND c.vocabulary_id = 'RxNorm'
    AND c.standard_concept = 'S'
    AND c.concept_class_id = 'Ingredient'
    AND c.valid_start_date <= current_date()
    AND c.valid_end_date > current_date()
concept_ids_identificados_agente:
- 21506108
