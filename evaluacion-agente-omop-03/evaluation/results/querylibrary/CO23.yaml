sql_generada_agente: |-
  SELECT extract(YEAR
                 FROM co.condition_start_date) AS diagnosis_year,
         extract(MONTH
                 FROM co.condition_start_date) AS diagnosis_month,
         c.concept_name,
         count(co.condition_occurrence_id) AS number_of_diagnoses
  FROM `condition_occurrence` AS co
  INNER JOIN `concept` AS c ON co.condition_concept_id = c.concept_id
  WHERE co.condition_concept_id IN (192279,
                                    4128221)
  GROUP BY diagnosis_year,
           diagnosis_month,
           c.concept_name
  ORDER BY diagnosis_year,
           diagnosis_month,
           c.concept_name;
