sql_generada_agente: |-
  SELECT min(co.condition_start_date) AS earliest_global_diagnosis_date
  FROM condition_occurrence AS co
  WHERE co.condition_concept_id = 23988
    AND EXISTS
      (SELECT 1
       FROM observation_period AS op
       WHERE op.person_id = co.person_id
         AND op.observation_period_start_date <= date_sub(co.condition_start_date, INTERVAL 6 MONTH)
         AND op.observation_period_end_date >= co.condition_start_date);
concept_ids_identificados_agente:
- 23988
