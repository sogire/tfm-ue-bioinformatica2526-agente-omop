    justificacion_gemini: |-
      El agente debe formular una consulta SQL que conecte las indicaciones médicas con la exposición a fármacos. Esto requiere unir la tabla `concept` (para la indicación) con `concept_ancestor` para identificar los conceptos de fármacos descendientes, y luego unir `concept_ancestor` con `drug_exposure` para obtener los eventos de exposición a fármacos. Finalmente, se debe unir `drug_exposure` con otra instancia de la tabla `concept` (para el fármaco) para filtrar los detalles del fármaco. Los `JOINs` específicos son: `concept.concept_id` con `concept_ancestor.ancestor_concept_id`, `concept_ancestor.descendant_concept_id` con `drug_exposure.drug_concept_id`, y `drug_exposure.drug_concept_id` con `concept.concept_id` (para el fármaco). Los `WHERE` filtros deben incluir el `concept_id` aprobado por el usuario para la indicación, asegurar que el concepto de indicación tenga `concept_class_id = 'Ind / CI'`, y para los conceptos de fármaco, filtrar por `domain_id = 'Drug'`, `vocabulary_id = 'RxNorm'` y `standard_concept = 'S'`. El recuento final debe ser de `DISTINCT person_id`.
