sql_generada_agente: |-
  WITH observationdurations AS
    (SELECT date_diff(observation_period_end_date, observation_period_start_date, DAY) + 1 AS duration_days
     FROM `observation_period`), -- CTEs individuales para cada percentil aproximado
  p25_cte AS
    (SELECT approx_quantiles(duration_days, 100)[offset(25)] AS val
     FROM observationdurations),
                                                                                    p50_cte AS
    (SELECT approx_quantiles(duration_days, 100)[offset(50)] AS val
     FROM observationdurations),
                                                                                    p75_cte AS
    (SELECT approx_quantiles(duration_days, 100)[offset(75)] AS val
     FROM observationdurations),
                                                                                    p90_cte AS
    (SELECT approx_quantiles(duration_days, 100)[offset(90)] AS val
     FROM observationdurations),
                                                                                    p95_cte AS
    (SELECT approx_quantiles(duration_days, 100)[offset(95)] AS val
     FROM observationdurations) -- Distribución de las duraciones (tabla de frecuencias)

  SELECT 'Duration Distribution' AS result_type,
         cast(duration_days AS STRING) AS metric,
         cast(count(*) AS BIGNUMERIC) AS value
  FROM observationdurations
  GROUP BY duration_days
  UNION ALL -- Estadísticas Descriptivas para las Duraciones

  SELECT 'Summary Statistics' AS result_type,
         'Minimum Duration' AS metric,
         cast(min(duration_days) AS BIGNUMERIC) AS value
  FROM observationdurations
  UNION ALL
  SELECT 'Summary Statistics' AS result_type,
         'Maximum Duration' AS metric,
         cast(max(duration_days) AS BIGNUMERIC) AS value
  FROM observationdurations
  UNION ALL
  SELECT 'Summary Statistics' AS result_type,
         'Average Duration' AS metric,
         cast(avg(duration_days) AS BIGNUMERIC) AS value
  FROM observationdurations
  UNION ALL
  SELECT 'Summary Statistics' AS result_type,
         'Standard Deviation' AS metric,
         cast(stddev(duration_days) AS BIGNUMERIC) AS value
  FROM observationdurations
  UNION ALL -- Percentiles de las duraciones

  SELECT 'Percentile' AS result_type,
         '25th Percentile (Approx)' AS metric,
         cast(
                (SELECT val
                 FROM p25_cte) AS BIGNUMERIC) AS value
  UNION ALL
  SELECT 'Percentile' AS result_type,
         '50th Percentile (Median, Approx)' AS metric,
         cast(
                (SELECT val
                 FROM p50_cte) AS BIGNUMERIC) AS value
  UNION ALL
  SELECT 'Percentile' AS result_type,
         '75th Percentile (Approx)' AS metric,
         cast(
                (SELECT val
                 FROM p75_cte) AS BIGNUMERIC) AS value
  UNION ALL
  SELECT 'Percentile' AS result_type,
         '90th Percentile (Approx)' AS metric,
         cast(
                (SELECT val
                 FROM p90_cte) AS BIGNUMERIC) AS value
  UNION ALL
  SELECT 'Percentile' AS result_type,
         '95th Percentile (Approx)' AS metric,
         cast(
                (SELECT val
                 FROM p95_cte) AS BIGNUMERIC) AS value
  ORDER BY result_type,
           metric;
