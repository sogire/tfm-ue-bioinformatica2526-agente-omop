sql_generada_agente: |-
  SELECT de.drug_concept_id,
         c.concept_name AS drug_name,
         avg(cast(cost.total_paid AS BIGNUMERIC) / de.quantity) AS average_cost_per_pill,
         min(cast(cost.total_paid AS BIGNUMERIC) / de.quantity) AS min_cost_per_pill,
         max(cast(cost.total_paid AS BIGNUMERIC) / de.quantity) AS max_cost_per_pill
  FROM drug_exposure AS de
  JOIN cost AS cost ON de.drug_exposure_id = cost.cost_event_id
  JOIN concept AS c ON de.drug_concept_id = c.concept_id
  WHERE de.quantity > 0
    AND de.drug_concept_id IN (906805,
                               1517070,
                               19010522)
  GROUP BY de.drug_concept_id,
           c.concept_name
  ORDER BY de.drug_concept_id
