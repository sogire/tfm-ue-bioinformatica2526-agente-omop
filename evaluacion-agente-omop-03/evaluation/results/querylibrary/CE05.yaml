sql_generada_agente: |-
  SELECT CASE
             WHEN extract(MONTH
                          FROM ce.condition_era_start_date) IN (12,
                                                                1,
                                                                2) THEN 'Winter'
             WHEN extract(MONTH
                          FROM ce.condition_era_start_date) IN (3,
                                                                4,
                                                                5) THEN 'Spring'
             WHEN extract(MONTH
                          FROM ce.condition_era_start_date) IN (6,
                                                                7,
                                                                8) THEN 'Summer'
             WHEN extract(MONTH
                          FROM ce.condition_era_start_date) IN (9,
                                                                10,
                                                                11) THEN 'Autumn'
             ELSE 'Unknown'
         END AS season,
         count(ce.condition_era_id) AS total_episodes
  FROM `condition_era` AS ce
  WHERE ce.condition_concept_id IN
      (SELECT ca.descendant_concept_id
       FROM `concept` AS c_icd9
       JOIN `concept_relationship` AS cr ON c_icd9.concept_id = cr.concept_id_1
       JOIN `concept_ancestor` AS ca ON cr.concept_id_2 = ca.ancestor_concept_id
       WHERE c_icd9.concept_code = '493.0'
         AND c_icd9.vocabulary_id = 'ICD9CM'
         AND cr.relationship_id = 'Maps to')
    AND ce.condition_era_start_date >= date_sub(current_date(), INTERVAL 2 YEAR)
  GROUP BY season
  ORDER BY CASE season
               WHEN 'Winter' THEN 1
               WHEN 'Spring' THEN 2
               WHEN 'Summer' THEN 3
               WHEN 'Autumn' THEN 4
               ELSE 5
           END;
