sql_generada_agente: |-
  SELECT ppp.plan_source_value AS insurance_plan_type,
         count(DISTINCT ppp.person_id) AS patient_count,
         cast(count(DISTINCT ppp.person_id) * 100.0 /
                (SELECT count(DISTINCT person_id)
                 FROM payer_plan_period) AS BIGNUMERIC) AS percentage_distribution
  FROM payer_plan_period ppp
  WHERE ppp.plan_source_value IS NOT NULL
  GROUP BY ppp.plan_source_value
  ORDER BY patient_count DESC;
