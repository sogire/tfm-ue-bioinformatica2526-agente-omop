sql_generada_agente: |-
  WITH first_observation_age AS
    (SELECT p.person_id,
            extract(YEAR
                    FROM min(op.observation_period_start_date)) - p.year_of_birth AS age_at_first_observation
     FROM `person` AS p
     JOIN `observation_period` AS op ON p.person_id = op.person_id
     GROUP BY p.person_id,
              p.year_of_birth),
       ordered_ages AS
    (SELECT array_agg(age_at_first_observation
                      ORDER BY age_at_first_observation) AS ages
     FROM first_observation_age)
  SELECT avg(foa.age_at_first_observation) AS mean_age_at_observation_start,
         stddev(foa.age_at_first_observation) AS stddev_age_at_observation_start,
         min(foa.age_at_first_observation) AS min_age_at_observation_start,
         max(foa.age_at_first_observation) AS max_age_at_observation_start,
         count(foa.person_id) AS total_patients, -- Calcular Q1 (25th percentile)
   ordered_ages.ages[offset(cast(floor(array_length(ordered_ages.ages) * 0.25) AS int64))] AS q1_age_at_observation_start, -- Calcular Mediana (50th percentile)
   ordered_ages.ages[offset(cast(floor(array_length(ordered_ages.ages) * 0.50) AS int64))] AS median_age_at_observation_start, -- Calcular Q3 (75th percentile)
   ordered_ages.ages[offset(cast(floor(array_length(ordered_ages.ages) * 0.75) AS int64))] AS q3_age_at_observation_start
  FROM first_observation_age AS foa
  CROSS JOIN ordered_ages
  GROUP BY -- Grouping for aggregates while joining with ordered_ages for single row output
   ordered_ages.ages
