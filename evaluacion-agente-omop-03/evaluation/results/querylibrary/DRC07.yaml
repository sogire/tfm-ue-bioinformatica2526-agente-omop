sql_generada_agente: |-
  SELECT avg(c.paid_by_payer) AS mean_paid_by_payer,
         stddev(c.paid_by_payer) AS stddev_paid_by_payer,
         min(c.paid_by_payer) AS min_paid_by_payer,
         max(c.paid_by_payer) AS max_paid_by_payer,
         approx_quantiles(c.paid_by_payer, 100)[offset(25)] AS q1_paid_by_payer,
         approx_quantiles(c.paid_by_payer, 100)[offset(50)] AS median_paid_by_payer,
         approx_quantiles(c.paid_by_payer, 100)[offset(75)] AS q3_paid_by_payer
  FROM drug_exposure de
  JOIN cost c ON de.drug_exposure_id = c.cost_event_id
  WHERE c.cost_domain_id = 'Drug Exposure' -- Domain name for Drug Exposure

    AND c.paid_by_payer IS NOT NULL
