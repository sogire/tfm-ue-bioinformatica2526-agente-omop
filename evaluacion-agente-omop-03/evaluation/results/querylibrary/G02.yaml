    justificacion_gemini: |-
      La consulta del agente es más precisa y robusta para la intención clínica de encontrar el 'concepto estándar correspondiente'. La consulta de referencia busca directamente el concepto por código y vocabulario, asumiendo implícitamente que dicho concepto es estándar. Sin embargo, el agente realiza una lógica de mapeo explícita (a través de `concept_relationship` con 'Maps to') y filtra explícitamente por `standard_concept = 'S'`, lo que garantiza que el concepto resultante es de hecho el estándar al que mapea el concepto fuente. Aunque estructuralmente más compleja, esta lógica se alinea mejor con la frase 'concepto estándar correspondiente', lo que la hace superior en adecuación a la intención clínica y lógica de negocio. Se descuenta una pequeña fracción por la diferencia estructural con el Gold Standard.
