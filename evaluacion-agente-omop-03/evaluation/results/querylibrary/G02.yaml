sql_generada_agente: |-
  SELECT c_standard.concept_id,
         c_standard.concept_name,
         c_standard.domain_id,
         c_standard.vocabulary_id
  FROM `concept` AS c_source
  JOIN `concept_relationship` AS cr ON c_source.concept_id = cr.concept_id_1
  JOIN `concept` AS c_standard ON cr.concept_id_2 = c_standard.concept_id
  WHERE c_source.concept_code = '74474003'
    AND c_source.vocabulary_id = 'SNOMED'
    AND cr.relationship_id = 'Maps to'
    AND c_standard.standard_concept = 'S'
    AND c_standard.invalid_reason IS NULL
