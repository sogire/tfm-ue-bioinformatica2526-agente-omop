sql_generada_agente: |-
  SELECT c2.concept_id AS standard_concept_id,
         c2.concept_name AS standard_concept_name,
         c2.domain_id,
         c2.vocabulary_id
  FROM `concept` AS c1
  JOIN `concept_relationship` AS cr ON c1.concept_id = cr.concept_id_1
  JOIN `concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  WHERE cr.relationship_id = 'Maps to'
    AND c1.concept_code IN ('070.30')
    AND c1.vocabulary_id = 'ICD9CM'
    AND cr.invalid_reason IS NULL
    AND c2.standard_concept = 'S'
    AND c2.invalid_reason IS NULL
