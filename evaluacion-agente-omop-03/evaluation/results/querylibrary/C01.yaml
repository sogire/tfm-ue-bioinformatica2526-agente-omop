sql_generada_agente: |-
  SELECT c.concept_id AS concept_id,
         c.concept_name AS nombre,
         c.concept_code AS codigo_fuente,
         c.concept_class_id AS clase_de_concepto,
         c.vocabulary_id AS vocabulario,
         CASE
             WHEN c.standard_concept = 'S'
                  AND c.invalid_reason IS NULL
                  AND (c.vocabulary_id IN ('SNOMED',
                                           'MedDRA')
                       AND c.concept_class_id = 'Clinical Finding') THEN 'True'
             ELSE 'False'
         END AS es_concepto_valido_enfermedad
  FROM `concept` AS c
  WHERE c.concept_id = 192671
    AND c.standard_concept = 'S'
    AND c.invalid_reason IS NULL;
concept_ids_identificados_agente:
- 192671
