sql_generada_agente: |-
  WITH drugeracounts AS
    (SELECT de.person_id,
            count(de.drug_era_id) AS drug_era_count
     FROM `drug_era` AS de
     GROUP BY de.person_id)
  SELECT avg(drug_era_count) AS mean_drug_eras,
         stddev(drug_era_count) AS stddev_drug_eras,
         approx_quantiles(drug_era_count, 100)[offset(25)] AS percentile_25_drug_eras,
         approx_quantiles(drug_era_count, 100)[offset(50)] AS percentile_50_drug_eras,
         approx_quantiles(drug_era_count, 100)[offset(75)] AS percentile_75_drug_eras
  FROM drugeracounts
