sql_generada_agente: |-
  SELECT cr.relationship_id,
         c1.vocabulary_id AS source_vocabulary_id,
         c1.concept_class_id AS source_concept_class_id,
         c2.vocabulary_id AS target_vocabulary_id,
         c2.concept_class_id AS target_concept_class_id,
         count(*) AS frequency
  FROM `concept_relationship` AS cr
  JOIN `concept` AS c1 ON cr.concept_id_1 = c1.concept_id
  JOIN `concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  GROUP BY cr.relationship_id,
           c1.vocabulary_id,
           c1.concept_class_id,
           c2.vocabulary_id,
           c2.concept_class_id
  ORDER BY frequency DESC
