sql_generada_agente: |-
  SELECT c.concept_name AS place_of_service_type,
         count(co.condition_occurrence_id) AS nausea_diagnosis_count
  FROM `condition_occurrence` AS co
  JOIN `visit_occurrence` AS vo ON co.visit_occurrence_id = vo.visit_occurrence_id
  JOIN `care_site` AS cs ON vo.care_site_id = cs.care_site_id
  JOIN `concept` AS c ON cs.place_of_service_concept_id = c.concept_id
  WHERE co.condition_concept_id = 31967
  GROUP BY c.concept_name
  ORDER BY nausea_diagnosis_count DESC;
