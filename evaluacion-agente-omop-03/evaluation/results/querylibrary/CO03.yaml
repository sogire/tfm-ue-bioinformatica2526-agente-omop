sql_generada_agente: |-
  SELECT sc.concept_name AS specialty_name,
         count(DISTINCT co.person_id) AS patient_count
  FROM `condition_occurrence` AS co
  JOIN `provider` AS p ON co.provider_id = p.provider_id
  JOIN `concept` AS sc ON p.specialty_concept_id = sc.concept_id
  WHERE co.condition_concept_id = 31967
  GROUP BY sc.concept_name
  ORDER BY patient_count DESC;
concept_ids_identificados_agente:
- 31967
