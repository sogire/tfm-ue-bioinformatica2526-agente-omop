sql_generada_agente: |-
  SELECT observation_period_count,
         count(person_id) AS number_of_patients
  FROM
    (SELECT person_id,
            count(observation_period_id) AS observation_period_count
     FROM `observation_period`
     GROUP BY person_id) AS person_observation_counts
  GROUP BY observation_period_count
  ORDER BY observation_period_count;
