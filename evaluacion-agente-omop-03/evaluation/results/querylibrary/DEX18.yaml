sql_generada_agente: |-
  SELECT dt_concept.concept_name AS drug_exposure_type,
         count(DISTINCT de.drug_exposure_id) AS exposure_count
  FROM `drug_exposure` AS de
  JOIN `concept` AS dt_concept ON de.drug_type_concept_id = dt_concept.concept_id
  JOIN `condition_occurrence` AS co ON de.person_id = co.person_id
  WHERE co.condition_concept_id IN (253954,
                                    37116831,
                                    40490351,
                                    40490814)
  GROUP BY dt_concept.concept_name
  ORDER BY exposure_count DESC;
