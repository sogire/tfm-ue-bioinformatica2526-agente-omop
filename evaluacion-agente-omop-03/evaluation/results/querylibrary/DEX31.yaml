sql_generada_agente: |-
  WITH drugexposurecounts AS
    (SELECT person_id,
            count(drug_exposure_id) AS drug_exposure_count
     FROM `drug_exposure`
     GROUP BY person_id),
       stats AS
    (SELECT min(drug_exposure_count) AS min_drug_exposures_per_person,
            max(drug_exposure_count) AS max_drug_exposures_per_person,
            cast(avg(drug_exposure_count) AS float64) AS avg_drug_exposures_per_person,
            cast(stddev(drug_exposure_count) AS float64) AS stddev_drug_exposures_per_person,
            approx_quantiles(drug_exposure_count, 100) AS quantiles
     FROM drugexposurecounts)
  SELECT min_drug_exposures_per_person,
         max_drug_exposures_per_person,
         avg_drug_exposures_per_person,
         stddev_drug_exposures_per_person,
         quantiles[offset(25)] AS p25_drug_exposures_per_person,
         quantiles[offset(50)] AS p50_drug_exposures_per_person,
         quantiles[offset(75)] AS p75_drug_exposures_per_person
  FROM stats;
