sql_generada_agente: |-
  SELECT cd.concept_name AS drug_name,
         cg.concept_name AS gender,
         count(*) AS treatment_episode_count
  FROM `drug_era` AS de
  JOIN `person` AS p ON de.person_id = p.person_id
  JOIN `concept` AS cg ON p.gender_concept_id = cg.concept_id
  JOIN `concept` AS cd ON de.drug_concept_id = cd.concept_id
  WHERE de.drug_concept_id IN (1300978,
                               1304643,
                               1549080)
    AND p.gender_concept_id IN (8507,
                                8532)
  GROUP BY cd.concept_name,
           cg.concept_name
  ORDER BY drug_name,
           treatment_episode_count DESC
