sql_generada_agente: |-
  SELECT c_parent.concept_id,
         c_parent.concept_name,
         c_parent.domain_id,
         c_parent.vocabulary_id
  FROM `concept_relationship` cr
  JOIN `concept` c_parent ON cr.concept_id_2 = c_parent.concept_id
  WHERE cr.concept_id_1 = 192671
    AND cr.relationship_id = 'Is a'
    AND c_parent.standard_concept = 'S'
    AND c_parent.invalid_reason IS NULL;
