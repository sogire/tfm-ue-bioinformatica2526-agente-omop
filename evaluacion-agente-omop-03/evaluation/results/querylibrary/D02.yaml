sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id,
         c.standard_concept,
         c.concept_class_id,
         c.concept_code,
         c.valid_start_date,
         c.valid_end_date,
         cr.relationship_id,
         c2.concept_name AS related_concept_name,
         c2.concept_id AS related_concept_id,
         cs.concept_synonym_name
  FROM `concept` AS c
  LEFT JOIN `concept_synonym` AS cs ON c.concept_id = cs.concept_id
  LEFT JOIN `concept_relationship` AS cr ON c.concept_id = cr.concept_id_1
  LEFT JOIN `concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  WHERE c.standard_concept = 'S'
    AND c.concept_class_id IS NOT NULL
    AND current_date() BETWEEN c.valid_start_date AND c.valid_end_date
    AND c.vocabulary_id IN ('RxNorm',
                            'ATC',
                            'NDFRT',
                            'VA Class')
    AND c.domain_id IN ('Drug',
                        'Drug Clinical Dose Group',
                        'Drug Ingredient',
                        'Drug Product',
                        'VA Class',
                        'ATC',
                        'NDFRT')
    AND (lower(c.concept_name) LIKE '%lipitor%'
         OR lower(cs.concept_synonym_name) LIKE '%lipitor%')
  ORDER BY c.concept_id,
           cr.relationship_id,
           cs.concept_synonym_name
