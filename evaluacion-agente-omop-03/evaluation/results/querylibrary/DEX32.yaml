sql_generada_agente: |-
  WITH drugexposurecounts AS
    (SELECT person_id,
            count(drug_exposure_id) AS drug_exposure_record_count
     FROM `drug_exposure`
     GROUP BY person_id)
  SELECT drug_exposure_record_count,
         count(person_id) AS number_of_patients
  FROM drugexposurecounts
  GROUP BY drug_exposure_record_count
  HAVING drug_exposure_record_count IN (3,
                                        4)
  ORDER BY drug_exposure_record_count;
