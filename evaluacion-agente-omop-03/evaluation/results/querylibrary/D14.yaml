sql_generada_agente: |-
  SELECT drug.concept_id,
         drug.concept_name,
         drug.domain_id,
         drug.vocabulary_id
  FROM concept AS drug
  JOIN concept_ancestor AS a ON a.descendant_concept_id = drug.concept_id
  WHERE a.ancestor_concept_id = 1710446 -- Cycloserine

    AND drug.standard_concept = 'S'
    AND drug.domain_id = 'Drug'
    AND current_date() >= drug.valid_start_date
    AND current_date() <= drug.valid_end_date;
