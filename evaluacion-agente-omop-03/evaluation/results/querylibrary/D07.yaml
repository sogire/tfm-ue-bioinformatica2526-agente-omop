sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.domain_id,
         c.vocabulary_id
  FROM concept AS c
  JOIN concept_ancestor AS ca ON c.concept_id = ca.descendant_concept_id
  WHERE ca.ancestor_concept_id = 1000560 -- Concepto de ingrediente "Ondansetron"

    AND c.domain_id = 'Drug'
    AND c.vocabulary_id = 'RxNorm'
    AND c.standard_concept = 'S'
    AND c.valid_end_date >= current_date() -- Añadir verificación de validez para el concepto principal

    AND c.concept_id IN
      (SELECT cr.concept_id_1
       FROM concept_relationship AS cr
       JOIN concept AS c_ing ON cr.concept_id_2 = c_ing.concept_id
       WHERE cr.relationship_id = 'Has ingredient'
         AND c_ing.domain_id = 'Drug'
         AND c_ing.standard_concept = 'S'
         AND c_ing.valid_end_date >= current_date() -- Añadir verificación de validez para el concepto ingrediente

       GROUP BY cr.concept_id_1
       HAVING count(DISTINCT cr.concept_id_2) = 1)
