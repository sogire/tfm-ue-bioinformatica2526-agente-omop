sql_generada_agente: |-
  SELECT co.condition_concept_id,
         cc.concept_name AS condition_concept_name,
         co.condition_type_concept_id,
         ctc.concept_name AS condition_type_concept_name,
         count(co.condition_occurrence_id) AS number_of_episodes,
         avg(cast(date_diff(co.condition_end_date, co.condition_start_date, DAY) AS BIGNUMERIC)) AS average_duration_days,
         min(date_diff(co.condition_end_date, co.condition_start_date, DAY)) AS min_duration_days,
         max(date_diff(co.condition_end_date, co.condition_start_date, DAY)) AS max_duration_days,
         approx_quantiles(cast(date_diff(co.condition_end_date, co.condition_start_date, DAY) AS BIGNUMERIC), 4)[offset(1)] AS percentile_25_duration_days,
         approx_quantiles(cast(date_diff(co.condition_end_date, co.condition_start_date, DAY) AS BIGNUMERIC), 4)[offset(2)] AS percentile_50_duration_days,
         approx_quantiles(cast(date_diff(co.condition_end_date, co.condition_start_date, DAY) AS BIGNUMERIC), 4)[offset(3)] AS percentile_75_duration_days
  FROM `condition_occurrence` AS co
  JOIN `concept` AS cc ON co.condition_concept_id = cc.concept_id
  JOIN `concept` AS ctc ON co.condition_type_concept_id = ctc.concept_id
  WHERE co.condition_end_date IS NOT NULL
    AND co.condition_start_date IS NOT NULL
  GROUP BY co.condition_concept_id,
           cc.concept_name,
           co.condition_type_concept_id,
           ctc.concept_name
  ORDER BY number_of_episodes DESC;
