sql_generada_agente: |-
  SELECT cs.place_of_service_concept_id,
         c.concept_name AS place_of_service_concept_name,
         count(cs.care_site_id) AS care_site_count
  FROM `care_site` AS cs
  JOIN `concept` AS c ON cs.place_of_service_concept_id = c.concept_id
  GROUP BY cs.place_of_service_concept_id,
           c.concept_name
  ORDER BY care_site_count DESC;
