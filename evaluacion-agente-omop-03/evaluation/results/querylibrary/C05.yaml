sql_generada_agente: |-
  SELECT c2.concept_id,
         c2.concept_name,
         c2.domain_id,
         c2.vocabulary_id,
         c2.concept_code
  FROM `concept` AS c1
  JOIN `concept_relationship` AS cr ON c1.concept_id = cr.concept_id_1
  JOIN `concept` AS c2 ON cr.concept_id_2 = c2.concept_id
  WHERE c1.concept_code = '706.1' -- El código de diagnóstico fuente (ej. ICD9CM)

    AND c1.vocabulary_id = 'ICD9CM' -- El vocabulario del código fuente

    AND cr.relationship_id = 'Maps to' -- Relación de mapeo a un concepto estándar

    AND c2.vocabulary_id = 'SNOMED' -- Aseguramos que el concepto mapeado es de SNOMED

    AND c2.standard_concept = 'S' -- Aseguramos que el concepto mapeado es estándar
