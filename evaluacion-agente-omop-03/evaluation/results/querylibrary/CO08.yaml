sql_generada_agente: |-
  SELECT vo.person_id,
         vo.visit_occurrence_id,
         vo.visit_start_date,
         vo.visit_end_date,
         date_diff(vo.visit_end_date, vo.visit_start_date, DAY) AS duration_days
  FROM `visit_occurrence` AS vo
  JOIN `condition_occurrence` AS co ON vo.visit_occurrence_id = co.visit_occurrence_id
  WHERE co.condition_concept_id = 31967
    AND vo.visit_concept_id = 9201 -- Assuming 9201 is the concept_id for 'Inpatient Visit'
  ORDER BY vo.person_id,
           vo.visit_start_date
