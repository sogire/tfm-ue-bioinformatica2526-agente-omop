sql_generada_agente: |-
  WITH firstobservationperiod AS
    (SELECT op.person_id,
            op.observation_period_start_date,
            op.observation_period_end_date,
            row_number() OVER (PARTITION BY op.person_id
                               ORDER BY op.observation_period_start_date) AS rn
     FROM `observation_period` AS op),
       observationduration AS
    (SELECT person_id,
            date_diff(observation_period_end_date, observation_period_start_date, MONTH) AS duration_months
     FROM firstobservationperiod
     WHERE rn = 1)
  SELECT duration_months,
         count(person_id) AS patient_count
  FROM observationduration
  GROUP BY duration_months
  ORDER BY duration_months;
