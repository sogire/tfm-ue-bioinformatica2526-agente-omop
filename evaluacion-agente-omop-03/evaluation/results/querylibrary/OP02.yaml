    justificacion_gemini: |-
      La consulta del agente es muy similar a la de referencia en su lógica general, el uso de la tabla `observation_period` y la identificación del primer período de observación. Sin embargo, la forma en que se calcula la duración en meses difiere: la consulta del agente utiliza `DATE_DIFF(..., MONTH)` que cuenta los límites de meses calendario completos, mientras que la consulta de referencia utiliza `FLOOR(DATEDIFF(day, ...)/30)` que aproxima los meses basándose en bloques de 30 días. Esto puede llevar a resultados numéricos ligeramente diferentes en la distribución de la duración.
