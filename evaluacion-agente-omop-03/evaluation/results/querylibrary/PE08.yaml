sql_generada_agente: |-
  SELECT l.zip AS postal_code,
         l.state AS state,
         count(DISTINCT p.person_id) AS patient_count
  FROM `person` AS p
  JOIN `location` AS l ON p.location_id = l.location_id
  WHERE l.zip IS NOT NULL
    AND l.zip != ''
  GROUP BY l.zip,
           l.state
  ORDER BY patient_count DESC
