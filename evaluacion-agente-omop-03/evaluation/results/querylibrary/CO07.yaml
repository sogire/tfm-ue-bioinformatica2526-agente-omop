sql_generada_agente: |-
  WITH nauseapatients AS
    (SELECT DISTINCT co.person_id
     FROM `condition_occurrence` AS co
     WHERE co.condition_concept_id = 31967),
       hospitalizednauseapatients AS
    (SELECT DISTINCT co.person_id
     FROM `condition_occurrence` AS co
     JOIN `visit_occurrence` AS vo ON co.person_id = vo.person_id
     AND co.visit_occurrence_id = vo.visit_occurrence_id
     WHERE co.condition_concept_id = 31967
       AND vo.visit_concept_id IN (9201,
                                   9203)-- 9201: Inpatient Visit, 9203: Emergency Room and Inpatient Visit
  )
  SELECT count(DISTINCT np.person_id) AS totalnauseapatients,
         count(DISTINCT hnp.person_id) AS nauseapatientswithhospitalization,
         cast(count(DISTINCT hnp.person_id) AS BIGNUMERIC) * 100 / nullif(cast(count(DISTINCT np.person_id) AS BIGNUMERIC), 0) AS percentagewithhospitalization
  FROM nauseapatients AS np
  LEFT JOIN hospitalizednauseapatients AS hnp ON np.person_id = hnp.person_id;
concept_ids_identificados_agente:
- 9201
- 9203
- 31967
