sql_generada_agente: |-
  SELECT ce.condition_concept_id,
         cn.concept_name AS condition_name,
         count(DISTINCT p.person_id) AS prevalence_count
  FROM person p
  JOIN death d ON p.person_id = d.person_id
  JOIN condition_era ce ON p.person_id = ce.person_id
  JOIN concept cn ON ce.condition_concept_id = cn.concept_id
  WHERE ce.condition_era_start_date <= d.death_date
    AND ce.condition_era_end_date >= date_sub(d.death_date, INTERVAL 30 DAY)
  GROUP BY ce.condition_concept_id,
           cn.concept_name
  ORDER BY prevalence_count DESC
concept_ids_identificados_agente: []
