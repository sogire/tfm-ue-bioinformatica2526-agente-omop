sql_generada_agente: |-
  SELECT de.drug_concept_id,
         sum(cast((c.paid_by_patient - c.paid_patient_copay) AS BIGNUMERIC)) AS total_out_of_pocket_cost
  FROM `drug_exposure` AS de
  JOIN `cost` AS c ON de.drug_exposure_id = c.cost_event_id
  WHERE de.drug_concept_id IN (906805,
                               1517070,
                               19010522)
    AND (c.paid_by_patient - c.paid_patient_copay) > 0
  GROUP BY de.drug_concept_id;
