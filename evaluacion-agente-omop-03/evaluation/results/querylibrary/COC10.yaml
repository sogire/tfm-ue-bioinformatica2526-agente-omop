sql_generada_agente: |-
  WITH conditioneras AS
    (SELECT ce.person_id,
            ce.condition_era_start_date,
            ce.condition_era_end_date,
            ce.condition_concept_id,
            date_diff(ce.condition_era_end_date, ce.condition_era_start_date, DAY) AS condition_duration_days
     FROM `condition_era` ce
     WHERE -- REEMPLAZA ESTO CON LOS CONCEPT ID DE LA CONDICIÓN ESPECÍFICA QUE QUIERES ANALIZAR.
   -- EJEMPLO: ce.condition_concept_id IN (12345, 67890)
   -- Por ahora, se usa un placeholder genérico:
   ce.condition_concept_id IN
         (SELECT concept_id
          FROM `concept`
          WHERE domain_id = 'Condition'
            AND standard_concept = 'S'
          LIMIT 10)-- <<= ¡IMPORTANTE! REEMPLAZA ESTA LÍNEA
  ),
       drugexposures AS
    (SELECT de.person_id,
            de.drug_era_start_date AS treatment_start_date,
            de.drug_era_end_date AS treatment_end_date
     FROM `drug_era` de
     WHERE de.drug_concept_id IN (778711,
                                  1112807,
                                  1115008,
                                  1125315,
                                  1177480,
                                  1506270)-- Concept IDs de fármacos confirmados por el evaluador
  ),
       procedureexposures_surgery AS
    (SELECT po.person_id,
            po.procedure_date AS treatment_start_date,
            po.procedure_date AS treatment_end_date -- Asumimos que la cirugía es de un día, o usar procedure_end_date si está disponible

     FROM `procedure_occurrence` po
     WHERE po.procedure_concept_id IN (4146273,
                                       618822,
                                       4100042,
                                       4167550,
                                       4144834)-- EJEMPLOS de Concept IDs de cirugía
  ),
       procedureexposures_physicaltherapy AS
    (SELECT po.person_id,
            po.procedure_date AS treatment_start_date,
            po.procedure_date AS treatment_end_date -- Asumimos terapia física es un evento, o usar procedure_end_date si está disponible

     FROM `procedure_occurrence` po
     WHERE po.procedure_concept_id IN (4039580,
                                       4079490,
                                       4238738,
                                       4261995,
                                       4261996)-- EJEMPLOS de Concept IDs de terapia física
  )
  SELECT treatmentcategory,
         count(DISTINCT person_id) AS num_patients,
         count(*) AS num_condition_eras,
         min(condition_duration_days) AS min_duration_days,
         max(condition_duration_days) AS max_duration_days,
         cast(avg(condition_duration_days) AS float64) AS avg_duration_days
  FROM
    (SELECT ce.person_id,
            ce.condition_duration_days,
            CASE
                WHEN EXISTS
                       (SELECT 1
                        FROM drugexposures de
                        WHERE ce.person_id = de.person_id
                          AND de.treatment_start_date <= ce.condition_era_end_date
                          AND de.treatment_end_date >= ce.condition_era_start_date)
                     AND EXISTS
                       (SELECT 1
                        FROM procedureexposures_surgery pse
                        WHERE ce.person_id = pse.person_id
                          AND pse.treatment_start_date <= ce.condition_era_end_date
                          AND pse.treatment_end_date >= ce.condition_era_start_date) THEN 'Surgery + Rx'
                WHEN EXISTS
                       (SELECT 1
                        FROM drugexposures de
                        WHERE ce.person_id = de.person_id
                          AND de.treatment_start_date <= ce.condition_era_end_date
                          AND de.treatment_end_date >= ce.condition_era_start_date)
                     AND EXISTS
                       (SELECT 1
                        FROM procedureexposures_physicaltherapy pt
                        WHERE ce.person_id = pt.person_id
                          AND pt.treatment_start_date <= ce.condition_era_end_date
                          AND pt.treatment_end_date >= ce.condition_era_start_date) THEN 'Physical Therapy + Rx'
                WHEN EXISTS
                       (SELECT 1
                        FROM procedureexposures_surgery pse
                        WHERE ce.person_id = pse.person_id
                          AND pse.treatment_start_date <= ce.condition_era_end_date
                          AND pse.treatment_end_date >= ce.condition_era_start_date)
                     AND EXISTS
                       (SELECT 1
                        FROM procedureexposures_physicaltherapy pt
                        WHERE ce.person_id = pt.person_id
                          AND pt.treatment_start_date <= ce.condition_era_end_date
                          AND pt.treatment_end_date >= ce.condition_era_start_date) THEN 'Surgery + Physical Therapy' -- Adding this combination

                WHEN EXISTS
                       (SELECT 1
                        FROM drugexposures de
                        WHERE ce.person_id = de.person_id
                          AND de.treatment_start_date <= ce.condition_era_end_date
                          AND de.treatment_end_date >= ce.condition_era_start_date) THEN 'Rx Only'
                WHEN EXISTS
                       (SELECT 1
                        FROM procedureexposures_surgery pse
                        WHERE ce.person_id = pse.person_id
                          AND pse.treatment_start_date <= ce.condition_era_end_date
                          AND pse.treatment_end_date >= ce.condition_era_start_date) THEN 'Surgery Only'
                WHEN EXISTS
                       (SELECT 1
                        FROM procedureexposures_physicaltherapy pt
                        WHERE ce.person_id = pt.person_id
                          AND pt.treatment_start_date <= ce.condition_era_end_date
                          AND pt.treatment_end_date >= ce.condition_era_start_date) THEN 'Physical Therapy Only'
                ELSE 'No Treatment'
            END AS treatmentcategory
     FROM conditioneras ce) AS categorized_data
  GROUP BY treatmentcategory
  ORDER BY treatmentcategory;
