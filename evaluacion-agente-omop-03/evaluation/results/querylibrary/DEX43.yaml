  SELECT de.person_id,
         de.drug_concept_id,
         c.concept_name AS drug_name,
         count(de.drug_exposure_id) AS dispensation_count
  FROM drug_exposure de
  JOIN concept c ON de.drug_concept_id = c.concept_id
  WHERE de.drug_concept_id IN (906805,
                               1517070,
                               19010522)
  GROUP BY de.person_id,
           de.drug_concept_id,
           c.concept_name
