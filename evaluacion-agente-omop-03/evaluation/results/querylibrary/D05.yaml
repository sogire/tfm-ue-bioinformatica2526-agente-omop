sql_generada_agente: |-
  SELECT anc.concept_id AS ancestor_concept_id,
         anc.concept_name AS ancestor_concept_name,
         anc.domain_id AS ancestor_domain_id,
         anc.vocabulary_id AS ancestor_vocabulary_id,
         anc.concept_class_id AS ancestor_concept_class_id,
         c.concept_id AS descendant_concept_id,
         c.concept_name AS descendant_concept_name,
         c.domain_id AS descendant_domain_id,
         c.vocabulary_id AS descendant_vocabulary_id,
         c.concept_class_id AS descendant_concept_class_id
  FROM `concept` AS c
  JOIN `concept_ancestor` AS ca ON c.concept_id = ca.descendant_concept_id
  JOIN `concept` AS anc ON ca.ancestor_concept_id = anc.concept_id
  WHERE ca.ancestor_concept_id = 966991
    AND c.domain_id = 'Drug'
    AND c.concept_class_id = 'Clinical Drug'
    AND c.standard_concept = 'S'
    AND c.invalid_reason IS NULL;
