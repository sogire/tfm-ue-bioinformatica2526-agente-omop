sql_generada_agente: |-
  SELECT avg(date_diff(de.drug_era_start_date, de.previous_era_end_date, DAY)) AS average_days_between_treatment_eras
  FROM
    (SELECT person_id,
            drug_concept_id,
            drug_era_start_date,
            drug_era_end_date,
            lag(drug_era_end_date, 1) OVER (PARTITION BY person_id, drug_concept_id
                                            ORDER BY drug_era_start_date) AS previous_era_end_date
     FROM `drug_era`
     WHERE drug_concept_id = 1304643) AS de
  WHERE de.previous_era_end_date IS NOT NULL
    AND date_diff(de.drug_era_start_date, de.previous_era_end_date, DAY) > 0
