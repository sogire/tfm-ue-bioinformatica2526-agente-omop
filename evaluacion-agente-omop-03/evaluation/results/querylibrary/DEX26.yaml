sql_generada_agente: |-
  SELECT avg(cast(unix_date(drug_exposure_end_date) AS float64)) AS mean_exposure_end_date_days,
         stddev(cast(unix_date(drug_exposure_end_date) AS float64)) AS stddev_exposure_end_date_days,
         min(drug_exposure_end_date) AS min_exposure_end_date,
         max(drug_exposure_end_date) AS max_exposure_end_date,
         cast(approx_quantiles(unix_date(drug_exposure_end_date), 100)[offset(25)] AS BIGNUMERIC) AS p25_exposure_end_date_days,
         cast(approx_quantiles(unix_date(drug_exposure_end_date), 100)[offset(50)] AS BIGNUMERIC) AS p50_exposure_end_date_days,
         cast(approx_quantiles(unix_date(drug_exposure_end_date), 100)[offset(75)] AS BIGNUMERIC) AS p75_exposure_end_date_days
  FROM `drug_exposure`
