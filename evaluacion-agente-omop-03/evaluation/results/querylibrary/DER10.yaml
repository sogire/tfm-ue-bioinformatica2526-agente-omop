sql_generada_agente: |-
  SELECT date_from_unix_date(cast(avg(unix_date(drug_era_end_date)) AS int64)) AS mean_drug_era_end_date,
         stddev(unix_date(drug_era_end_date)) AS stddev_days_drug_era_end_date,
         min(drug_era_end_date) AS min_drug_era_end_date,
         max(drug_era_end_date) AS max_drug_era_end_date,
         date_from_unix_date(cast(approx_quantiles(unix_date(drug_era_end_date), 4)[offset(1)] AS int64)) AS p25_drug_era_end_date,
         date_from_unix_date(cast(approx_quantiles(unix_date(drug_era_end_date), 4)[offset(2)] AS int64)) AS p50_drug_era_end_date,
         date_from_unix_date(cast(approx_quantiles(unix_date(drug_era_end_date), 4)[offset(3)] AS int64)) AS p75_drug_era_end_date
  FROM drug_era
  WHERE drug_era_end_date IS NOT NULL
