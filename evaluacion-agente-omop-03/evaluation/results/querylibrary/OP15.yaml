sql_generada_agente: |-
  WITH firstobservation AS
    (SELECT person_id,
            min(observation_period_start_date) AS min_observation_period_start_date
     FROM observation_period
     GROUP BY person_id)
  SELECT p.gender_concept_id,
         g.concept_name AS gender,
         (extract(YEAR
                  FROM fo.min_observation_period_start_date) - p.year_of_birth) AS age_at_first_observation_start,
         count(DISTINCT p.person_id) AS number_of_patients
  FROM person AS p
  JOIN firstobservation AS fo ON p.person_id = fo.person_id
  JOIN concept AS g ON p.gender_concept_id = g.concept_id
  WHERE (extract(YEAR
                 FROM fo.min_observation_period_start_date) - p.year_of_birth) >= 0
  GROUP BY p.gender_concept_id,
           g.concept_name,
           age_at_first_observation_start
  ORDER BY gender,
           age_at_first_observation_start;
