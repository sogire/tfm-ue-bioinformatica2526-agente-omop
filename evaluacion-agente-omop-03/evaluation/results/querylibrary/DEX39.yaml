sql_generada_agente: |-
  SELECT de.drug_concept_id,
         dc.concept_name AS drug_name,
         de.drug_type_concept_id,
         dtc.concept_name AS drug_type_name,
         count(de.drug_exposure_id) AS dispensation_count
  FROM `drug_exposure` AS de
  JOIN `concept` AS dc ON de.drug_concept_id = dc.concept_id
  JOIN `concept` AS dtc ON de.drug_type_concept_id = dtc.concept_id
  WHERE de.drug_concept_id IN (906805,
                               1517070,
                               19010522)
    AND de.drug_type_concept_id IN (38000175,
                                    38000179)
  GROUP BY de.drug_concept_id,
           dc.concept_name,
           de.drug_type_concept_id,
           dtc.concept_name
  ORDER BY de.drug_concept_id,
           de.drug_type_concept_id;
