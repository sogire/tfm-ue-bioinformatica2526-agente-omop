sql_generada_agente: |-
  SELECT drug.concept_id AS drug_concept_id,
         drug.concept_name AS drug_name,
         drug.concept_code AS drug_concept_code
  FROM concept_relationship AS r
  JOIN concept_ancestor AS snomed ON r.concept_id_1 = snomed.descendant_concept_id
  JOIN concept_ancestor AS ind ON r.concept_id_2 = ind.ancestor_concept_id
  JOIN concept AS drug ON ind.descendant_concept_id = drug.concept_id
  WHERE snomed.ancestor_concept_id IN (253954,
                                       4310580)
    AND r.relationship_id IN ('247',
                              '248')
    AND current_date() BETWEEN drug.valid_start_date AND drug.valid_end_date;
