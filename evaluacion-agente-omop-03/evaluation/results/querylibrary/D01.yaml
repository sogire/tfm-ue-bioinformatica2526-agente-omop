sql_generada_agente: |-
  SELECT *,
         CASE
             WHEN domain_id = 'Drug' THEN TRUE
             ELSE FALSE
         END AS is_drug_concept_flag
  FROM `concept`
  WHERE concept_id = 1545999
    AND valid_start_date <= current_date()
    AND valid_end_date >= current_date();
