sql_generada_agente: |-
  WITH diabetesconcepts AS
    (SELECT ca.descendant_concept_id
     FROM `concept_ancestor` ca
     WHERE ca.ancestor_concept_id = 201820 -- Concept ID for 'Diabetes mellitus'
  ),
       diabetespatientswithfirstdiagnosis AS
    (SELECT co.person_id,
            min(co.condition_start_date) AS first_diabetes_diagnosis_date
     FROM `condition_occurrence` co
     JOIN diabetesconcepts dc ON co.condition_concept_id = dc.descendant_concept_id
     GROUP BY co.person_id),
       comorbidities AS
    (SELECT co.person_id,
            co.condition_concept_id
     FROM `condition_occurrence` co
     JOIN diabetespatientswithfirstdiagnosis dpfd ON co.person_id = dpfd.person_id
     LEFT JOIN diabetesconcepts dc_check ON co.condition_concept_id = dc_check.descendant_concept_id
     WHERE co.condition_start_date > dpfd.first_diabetes_diagnosis_date
       AND dc_check.descendant_concept_id IS NULL -- Excluir conceptos relacionados con la diabetes
  )
  SELECT c.concept_name AS comorbidityname,
         count(DISTINCT cm.person_id) AS numberofpatients
  FROM comorbidities cm
  JOIN `concept` c ON cm.condition_concept_id = c.concept_id
  WHERE c.domain_id = 'Condition'
    AND c.standard_concept = 'S'
  GROUP BY comorbidityname
  ORDER BY numberofpatients DESC
  LIMIT 10
concept_ids_identificados_agente:
- 201820
