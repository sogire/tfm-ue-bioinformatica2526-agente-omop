sql_generada_agente: |-
  SELECT drug_concept.concept_id AS drug_concept_id,
         drug_concept.concept_name AS drug_name,
         dose_form_concept.concept_id AS dose_form_concept_id,
         dose_form_concept.concept_name AS dose_form_name
  FROM `concept_relationship` AS cr
  JOIN `concept` AS drug_concept ON cr.concept_id_1 = drug_concept.concept_id
  JOIN `concept` AS dose_form_concept ON cr.concept_id_2 = dose_form_concept.concept_id
  WHERE cr.relationship_id = 'RxNorm has dose form'
    AND cr.concept_id_1 = 19060647
    AND current_date() BETWEEN cr.valid_start_date AND cr.valid_end_date
