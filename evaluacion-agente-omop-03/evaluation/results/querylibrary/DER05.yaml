sql_generada_agente: |-
  WITH commoncoldindicateddrugs AS
    (SELECT cr.concept_id_1 AS drug_concept_id_indicated,
            c.concept_name AS drug_name_indicated
     FROM `concept_relationship` cr
     JOIN `concept` c ON cr.concept_id_1 = c.concept_id
     WHERE cr.concept_id_2 = 260427 -- Concept ID for 'Common cold'

       AND cr.relationship_id IN ('Has FDA-appr ind',
                                  'May treat')),
       alldescendantdrugs AS
    (SELECT ccid.drug_concept_id_indicated,
            ccid.drug_name_indicated,
            ca.descendant_concept_id AS specific_drug_concept_id
     FROM commoncoldindicateddrugs ccid
     JOIN `concept_ancestor` ca ON ccid.drug_concept_id_indicated = ca.ancestor_concept_id),
       patientsperdrug AS
    (SELECT add.drug_name_indicated,
            count(DISTINCT de.person_id) AS num_patients_exposed
     FROM `drug_era` de
     JOIN alldescendantdrugs ADD ON de.drug_concept_id = add.specific_drug_concept_id
     GROUP BY add.drug_name_indicated),
       totalpatientsexposed AS
    (SELECT count(DISTINCT de.person_id) AS total_patients
     FROM `drug_era` de
     JOIN alldescendantdrugs ADD ON de.drug_concept_id = add.specific_drug_concept_id)
  SELECT ppd.drug_name_indicated,
         ppd.num_patients_exposed,
         tpe.total_patients,
         cast(ppd.num_patients_exposed AS BIGNUMERIC) / tpe.total_patients AS proportion_of_patients
  FROM patientsperdrug ppd,
       totalpatientsexposed tpe
  ORDER BY proportion_of_patients DESC;
