sql_generada_agente: |-
  SELECT count(t.observation_period_start_date) AS total_records,
         date_from_unix_date(cast(avg(unix_date(t.observation_period_start_date)) AS int64)) AS average_start_date,
         cast(stddev(unix_date(t.observation_period_start_date)) AS float64) AS stddev_start_date_in_days,
         date_from_unix_date(cast(approx_quantiles(unix_date(t.observation_period_start_date), 4)[offset(1)] AS int64)) AS q1_start_date,
         date_from_unix_date(cast(approx_quantiles(unix_date(t.observation_period_start_date), 4)[offset(2)] AS int64)) AS median_start_date,
         date_from_unix_date(cast(approx_quantiles(unix_date(t.observation_period_start_date), 4)[offset(3)] AS int64)) AS q3_start_date
  FROM `observation_period` AS t
