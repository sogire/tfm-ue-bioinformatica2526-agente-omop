sql_generada_agente: |-
  SELECT date_from_unix_date(cast(avg(unix_date(condition_start_date)) AS int64)) AS mean_start_date,
         stddev(unix_date(condition_start_date)) AS stddev_days_from_epoch, -- Standard deviation is in days relative to epoch
   date_from_unix_date(cast(approx_quantiles(unix_date(condition_start_date), 100)[offset(25)] AS int64)) AS p25_start_date,
   date_from_unix_date(cast(approx_quantiles(unix_date(condition_start_date), 100)[offset(50)] AS int64)) AS p50_median_start_date,
   date_from_unix_date(cast(approx_quantiles(unix_date(condition_start_date), 100)[offset(75)] AS int64)) AS p75_start_date
  FROM `condition_occurrence`
