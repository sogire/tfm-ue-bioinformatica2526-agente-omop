sql_generada_agente: |-
  SELECT cs.care_site_name,
         cs.place_of_service_concept_id,
         count(DISTINCT vo.person_id) AS total_patients
  FROM visit_occurrence AS vo
  JOIN care_site AS cs ON vo.care_site_id = cs.care_site_id
  GROUP BY cs.care_site_name,
           cs.place_of_service_concept_id
  ORDER BY cs.care_site_name,
           cs.place_of_service_concept_id
