sql_generada_agente: |-
  SELECT dtc.concept_name AS drug_type,
         posc.concept_name AS place_of_service,
         count(de.drug_exposure_id) AS number_of_episodes
  FROM `drug_exposure` AS de
  JOIN `concept` AS dtc ON de.drug_type_concept_id = dtc.concept_id
  LEFT JOIN `visit_occurrence` AS vo ON de.visit_occurrence_id = vo.visit_occurrence_id
  LEFT JOIN `care_site` AS cs ON vo.care_site_id = cs.care_site_id
  LEFT JOIN `concept` AS posc ON cs.place_of_service_concept_id = posc.concept_id
  GROUP BY dtc.concept_name,
           posc.concept_name
  ORDER BY number_of_episodes DESC;
