sql_generada_agente: |-
  SELECT c.concept_name AS concomitant_drug_name,
         count(DISTINCT de.person_id) AS number_of_patients_exposed
  FROM `drug_exposure` de
  JOIN `concept` c ON de.drug_concept_id = c.concept_id
  WHERE de.person_id IN
      (SELECT DISTINCT person_id
       FROM `drug_exposure`
       WHERE drug_concept_id IN (1336825,
                                 19047763)
         AND extract(YEAR
                     FROM drug_exposure_start_date) = 2008)
    AND extract(YEAR
                FROM de.drug_exposure_start_date) = 2008
    AND de.drug_concept_id NOT IN (1336825,
                                   19047763)
    AND de.drug_concept_id != 0
  GROUP BY c.concept_name
  ORDER BY number_of_patients_exposed DESC
  LIMIT 100;
