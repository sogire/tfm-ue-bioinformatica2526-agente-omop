sql_generada_agente: |-
  SELECT person_id,
         count(DISTINCT drug_concept_id) AS distinct_drug_count
  FROM drug_exposure
  GROUP BY person_id
  HAVING count(DISTINCT drug_concept_id) > 10
  ORDER BY distinct_drug_count DESC;
