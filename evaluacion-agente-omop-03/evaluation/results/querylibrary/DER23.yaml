sql_generada_agente: |-
  SELECT de.drug_concept_id,
         c.concept_name AS drug_concept_name,
         count(DISTINCT de.person_id) AS number_of_people_exposed,
         min(de.drug_era_start_date) AS min_drug_era_start_date,
         max(de.drug_era_start_date) AS max_drug_era_start_date,
         date_from_unix_date(cast(avg(unix_date(de.drug_era_start_date)) AS int64)) AS avg_drug_era_start_date,
         cast(stddev(unix_date(de.drug_era_start_date)) AS BIGNUMERIC) AS stddev_days_from_1970,
         date_from_unix_date(cast(approx_quantiles(unix_date(de.drug_era_start_date), 4)[offset(1)] AS int64)) AS p25_drug_era_start_date,
         date_from_unix_date(cast(approx_quantiles(unix_date(de.drug_era_start_date), 4)[offset(2)] AS int64)) AS p50_drug_era_start_date,
         date_from_unix_date(cast(approx_quantiles(unix_date(de.drug_era_start_date), 4)[offset(3)] AS int64)) AS p75_drug_era_start_date
  FROM `drug_era` AS de
  JOIN `concept` AS c ON de.drug_concept_id = c.concept_id
  WHERE de.drug_concept_id IN (1300978,
                               1304643,
                               1549080)
  GROUP BY de.drug_concept_id,
           c.concept_name
  ORDER BY de.drug_concept_id;
