sql_generada_agente: |-
  SELECT DISTINCT c.concept_id,
                  c.concept_name,
                  c.domain_id,
                  c.vocabulary_id
  FROM `concept` AS c
  LEFT JOIN `concept_synonym` AS cs ON c.concept_id = cs.concept_id
  WHERE c.domain_id = 'Procedure'
    AND c.standard_concept = 'S'
    AND (lower(c.concept_name) LIKE '%artery bypass%'
         OR lower(cs.concept_synonym_name) LIKE '%artery bypass%')
    AND current_date() BETWEEN c.valid_start_date AND c.valid_end_date
    AND c.vocabulary_id IN ('SNOMED',
                            'CPT4',
                            'HCPCS')
  ORDER BY c.concept_name
