sql_generada_agente: |-
  WITH observationperiodmonths AS
    (SELECT op.person_id,
            op.observation_period_start_date,
            op.observation_period_end_date,
            calendar_month_start_date
     FROM observation_period op,
          unnest(generate_date_array(date_trunc(op.observation_period_start_date, MONTH), date_trunc(op.observation_period_end_date, MONTH), INTERVAL 1 MONTH)) AS calendar_month_start_date),
       monthlyoverlap AS
    (SELECT person_id,
            calendar_month_start_date,
            greatest(observation_period_start_date, calendar_month_start_date) AS overlap_start,
            least(observation_period_end_date, last_day(calendar_month_start_date)) AS overlap_end
     FROM observationperiodmonths)
  SELECT extract(MONTH
                 FROM calendar_month_start_date) AS generic_month,
         sum(date_diff(overlap_end, overlap_start, DAY) + 1) AS total_person_days_active
  FROM monthlyoverlap
  GROUP BY generic_month
  ORDER BY generic_month;
