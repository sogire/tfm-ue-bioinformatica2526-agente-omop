sql_generada_agente: |-
  SELECT DISTINCT CASE
                      WHEN c1.concept_name < c2.concept_name THEN c1.concept_name
                      ELSE c2.concept_name
                  END AS condition_1_name,
                  CASE
                      WHEN c1.concept_name < c2.concept_name THEN c2.concept_name
                      ELSE c1.concept_name
                  END AS condition_2_name,
                  t1.condition_era_start_date AS condition_1_start_date,
                  t1.condition_era_end_date AS condition_1_end_date,
                  t2.condition_era_start_date AS condition_2_start_date,
                  t2.condition_era_end_date AS condition_2_end_date
  FROM condition_era AS t1
  JOIN condition_era AS t2 ON t1.person_id = t2.person_id
  AND t2.condition_era_start_date <= t1.condition_era_end_date
  AND (t2.condition_era_end_date IS NULL
       OR t2.condition_era_end_date >= t1.condition_era_start_date)
  JOIN concept AS c1 ON t1.condition_concept_id = c1.concept_id
  JOIN concept AS c2 ON t2.condition_concept_id = c2.concept_id
  WHERE t1.person_id = [your_person_id_here] -- Reemplaza con el ID del paciente

    AND t1.condition_concept_id <> t2.condition_concept_id
  ORDER BY condition_1_name,
           condition_2_name;
