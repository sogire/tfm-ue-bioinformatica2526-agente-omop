sql_generada_agente: |-
  SELECT c.concept_id,
         c.concept_name,
         c.vocabulary_id,
         c.domain_id,
         c.concept_class_id
  FROM concept c
  JOIN concept_ancestor ca ON c.concept_id = ca.descendant_concept_id
  WHERE ca.ancestor_concept_id = 4345991 -- Concepto aprobado por el usuario para "Vómitos"

    AND c.domain_id = 'Drug'
    AND c.standard_concept = 'S'
    AND current_date() >= c.valid_start_date
    AND current_date() <= c.valid_end_date ;
