sql_generada_agente: |-
  SELECT a.concept_id AS condition_concept_id,
         a.concept_name AS condition_name,
         a.domain_id AS condition_domain,
         d.concept_id AS causative_agent_concept_id,
         d.concept_name AS causative_agent_name,
         d.domain_id AS causative_agent_domain
  FROM `concept_relationship` cr
  JOIN `concept` a ON cr.concept_id_1 = a.concept_id
  JOIN `concept` d ON cr.concept_id_2 = d.concept_id
  WHERE cr.relationship_id = 'Has causative agent'
    AND d.concept_id = 4248851;
concept_ids_identificados_agente:
- 4248851
