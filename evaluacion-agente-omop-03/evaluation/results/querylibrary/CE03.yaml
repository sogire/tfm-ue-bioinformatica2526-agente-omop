sql_generada_agente: |-
  SELECT CASE
             WHEN (extract(YEAR
                           FROM ce.condition_era_start_date) - p.year_of_birth) < 18 THEN '0-17'
             WHEN (extract(YEAR
                           FROM ce.condition_era_start_date) - p.year_of_birth) BETWEEN 18 AND 34 THEN '18-34'
             WHEN (extract(YEAR
                           FROM ce.condition_era_start_date) - p.year_of_birth) BETWEEN 35 AND 49 THEN '35-49'
             WHEN (extract(YEAR
                           FROM ce.condition_era_start_date) - p.year_of_birth) BETWEEN 50 AND 64 THEN '50-64'
             ELSE '65+'
         END AS age_group,
         c_gender.concept_name AS gender,
         min(date_diff(ce.condition_era_end_date, ce.condition_era_start_date, DAY) + 1) AS min_duration_days,
         max(date_diff(ce.condition_era_end_date, ce.condition_era_start_date, DAY) + 1) AS max_duration_days,
         avg(cast(date_diff(ce.condition_era_end_date, ce.condition_era_start_date, DAY) + 1 AS float64)) AS avg_duration_days
  FROM `condition_era` AS ce
  JOIN `person` AS p ON ce.person_id = p.person_id
  JOIN `concept` AS c_gender ON p.gender_concept_id = c_gender.concept_id
  JOIN `concept_ancestor` AS ca ON ce.condition_concept_id = ca.descendant_concept_id
  WHERE ca.ancestor_concept_id = 359817006 -- Concept ID for 'Fracture of hip' or its broader equivalent
  GROUP BY age_group,
           gender
  ORDER BY age_group,
           gender;
