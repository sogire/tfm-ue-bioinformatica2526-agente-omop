sql_generada_agente: |-
  SELECT cast(avg(distinct_active_ingredients_count) AS float64) AS average_distinct_active_ingredients
  FROM
    (SELECT person_id,
            count(DISTINCT drug_concept_id) AS distinct_active_ingredients_count
     FROM drug_era
     GROUP BY person_id);
