    justificacion_gemini: |-
      La consulta generada por el agente es lógicamente idéntica a la consulta de referencia. Ambas utilizan la tabla `drug_era` para contar los principios activos (drug_concept_id) distintos por paciente (person_id) y luego calculan el promedio de estos conteos. La consulta del agente incluye un CAST explícito a FLOAT64 para el promedio, lo cual es una buena práctica para BigQuery y mejora la robustez del tipo de dato, y utiliza un nombre de tabla relativo, lo cual también es adecuado.
