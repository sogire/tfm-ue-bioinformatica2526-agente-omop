sql_generada_agente: |-
  SELECT avg(cast(quantity AS float64)) AS mean_quantity,
         stddev(cast(quantity AS float64)) AS stddev_quantity,
         min(cast(quantity AS float64)) AS min_quantity,
         max(cast(quantity AS float64)) AS max_quantity,
         approx_quantiles(cast(quantity AS float64), 100)[offset(25)] AS percentile_25,
         approx_quantiles(cast(quantity AS float64), 100)[offset(50)] AS median_quantity,
         approx_quantiles(cast(quantity AS float64), 100)[offset(75)] AS percentile_75,
         approx_quantiles(cast(quantity AS float64), 100)[offset(90)] AS percentile_90,
         approx_quantiles(cast(quantity AS float64), 100)[offset(95)] AS percentile_95
  FROM `drug_exposure`
  WHERE quantity > 0
