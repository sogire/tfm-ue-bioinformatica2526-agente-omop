sql_generada_agente: |-
  SELECT co.condition_concept_id,
         de.drug_concept_id,
         count(de.drug_exposure_id) AS dispensation_count
  FROM drug_exposure AS de
  INNER JOIN condition_occurrence AS co ON de.person_id = co.person_id
  AND de.visit_occurrence_id = co.visit_occurrence_id
  WHERE de.drug_concept_id IN (906805,
                               1517070,
                               19010522)
    AND co.condition_concept_id IN (26052,
                                    258375)
  GROUP BY co.condition_concept_id,
           de.drug_concept_id;
